<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nakuru Land Information Dashboard</title>
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <!-- Export libraries -->
    <script src="https://unpkg.com/leaflet-image@0.4.0/leaflet-image.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Supabase & Chroma -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"></script>
    <style>
        /* ===== Reset & Base ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            display: flex;
            height: 100vh;
            overflow: hidden;
            color: #1e293b;
        }
        /* ===== Sidebar ===== */
        #sidebar {
            width: 420px;
            min-width: 420px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #e2e8f0;
            z-index: 10;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar-header {
            padding: 16px 20px;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        #sidebar-header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }
        #sidebar-header h1 span { color: #22c55e; }
        #sidebar-header .badge {
            background: rgba(255,255,255,0.12);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
        }
        /* ===== Tabs ===== */
        .tab-bar {
            display: flex;
            background: #f1f5f9;
            border-bottom: 1px solid #e2e8f0;
            flex-shrink: 0;
            overflow-x: auto;
        }
        .tab-btn {
            flex: 1;
            padding: 10px 8px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            font-weight: 500;
            font-size: 13px;
            color: #475569;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
            min-width: 80px;
        }
        .tab-btn:hover { background: #e9edf4; }
        .tab-btn.active {
            color: #0f172a;
            border-bottom-color: #2563eb;
            background: white;
        }
        /* ===== Sidebar Controls ===== */
        #sidebar-controls {
            padding: 12px 16px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        #sidebar-controls input {
            flex: 1;
            padding: 6px 12px;
            border: 1px solid #d1d5db;
            border-radius: 30px;
            font-size: 13px;
            outline: none;
            background: white;
            min-width: 100px;
        }
        #sidebar-controls input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        #refreshBtn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }
        #refreshBtn:hover { background: #1d4ed8; }
        #refreshBtn:disabled { background: #94a3b8; cursor: not-allowed; }
        #statusText {
            font-size: 12px;
            color: #475569;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .status-badge {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .status-badge.idle { background: #22c55e; }
        .status-badge.running { background: #eab308; animation: pulse 1s infinite; }
        .status-badge.error { background: #ef4444; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* ===== Export Buttons ===== */
        .export-bar {
            display: flex;
            gap: 6px;
            padding: 6px 12px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .export-btn {
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 500;
            color: #1e293b;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .export-btn:hover { background: #e9edf4; border-color: #2563eb; }
        .export-btn i { font-size: 14px; }

        /* ===== Property List ===== */
        #property-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
        }
        #property-list::-webkit-scrollbar { width: 5px; }
        #property-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .property-item {
            padding: 10px 16px;
            border-bottom: 1px solid #f1f5f9;
            cursor: pointer;
            transition: background 0.1s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .property-item:hover { background: #f1f5f9; }
        .property-item.active { background: #eef2ff; border-left: 3px solid #2563eb; }
        .property-item .info {
            flex: 1;
            min-width: 0;
        }
        .property-item .info .title {
            font-weight: 500;
            font-size: 14px;
            color: #0f172a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .property-item .info .meta {
            font-size: 12px;
            color: #64748b;
            margin-top: 2px;
        }
        .property-item .info .meta span { margin-right: 12px; }
        .property-item .price {
            font-weight: 600;
            font-size: 14px;
            color: #0f172a;
            white-space: nowrap;
            margin-left: 12px;
        }
        .property-item .source-tag {
            font-size: 9px;
            text-transform: uppercase;
            background: #e2e8f0;
            padding: 2px 8px;
            border-radius: 12px;
            color: #475569;
            margin-left: 6px;
            letter-spacing: 0.3px;
        }

        /* ===== Map Container ===== */
        #map-container {
            flex: 1;
            position: relative;
        }
        #map { height: 100%; width: 100%; }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(15,23,42,0.9);
            color: white;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            backdrop-filter: blur(8px);
        }
        .toast.show { opacity: 1; }
        .toast.error { background: rgba(239,68,68,0.9); }
        .toast.success { background: rgba(34,197,94,0.9); }
        .toast.info { background: rgba(37,99,235,0.9); }

        /* ===== Legend ===== */
        .legend {
            position: absolute;
            bottom: 30px;
            right: 20px;
            z-index: 1000;
            background: white;
            padding: 12px 16px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            font-size: 12px;
            min-width: 140px;
        }
        .legend .title { font-weight: 600; margin-bottom: 4px; color: #0f172a; }
        .legend .gradient { height: 10px; border-radius: 4px; margin: 4px 0; }
        .legend .labels { display: flex; justify-content: space-between; font-size: 10px; color: #475569; }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            #sidebar { width: 100%; min-width: 0; height: 45vh; border-right: none; border-bottom: 1px solid #e2e8f0; }
            #map-container { height: 55vh; }
            body { flex-direction: column; }
            .legend { bottom: 10px; right: 10px; padding: 8px 12px; font-size: 10px; min-width: 100px; }
        }

        .ward-label {
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 12px;
            font-weight: 500;
        }

        /* Hide legend container when not needed */
        .legend-placeholder { display: none; }
    </style>
</head>
<body>

<div id="sidebar">
    <div id="sidebar-header">
        <h1>Nakuru <span>Info</span></h1>
        <span class="badge" id="count-badge">0</span>
    </div>

    <!-- Tabs -->
    <div class="tab-bar" id="tabBar">
        <button class="tab-btn active" data-tab="land">🏠 Land</button>
        <button class="tab-btn" data-tab="health">🏥 Health</button>
        <button class="tab-btn" data-tab="schools">🎓 Schools</button>
        <button class="tab-btn" data-tab="water">💧 Water</button>
    </div>

    <!-- Controls -->
    <div id="sidebar-controls">
        <span id="statusText">
            <span class="status-badge idle" id="statusBadge"></span>
            <span id="statusLabel">Idle</span>
        </span>
        <input type="text" id="searchInput" placeholder="Filter by title, location..." />
        <button id="refreshBtn" onclick="refreshMap()">Refresh</button>
    </div>

    <!-- Export Bar -->
    <div class="export-bar" id="exportBar">
        <button class="export-btn" onclick="exportPNG()">🖼️ PNG</button>
        <button class="export-btn" onclick="exportPDF()">📄 PDF</button>
        <button class="export-btn" onclick="exportCSV()">📊 CSV</button>
        <button class="export-btn" onclick="exportGeoJSON()">🌍 GeoJSON</button>
        <button class="export-btn" onclick="window.print()">🖨️ Print</button>
    </div>

    <!-- Property List -->
    <div id="property-list">
        <div style="padding:30px 20px;text-align:center;color:#94a3b8;font-size:14px;">Loading data...</div>
    </div>
</div>

<div id="map-container">
    <div id="map"></div>
    <div id="legend-container"></div>
</div>

<div id="toast" class="toast">Loading...</div>

<script>
    // ============================================================
    // CONFIGURATION
    // ============================================================
    const SUPABASE_URL = 'https://oeaoglqrojkexfovrwgl.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9lYW9nbHFyb2prZXhmb3Zyd2dsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMDcyMzYsImV4cCI6MjEwMTY4MzIzNn0.k3DVFFyWwaSCxra2WipcKr1CDJ6eQ2dVELcBAbmFJu8';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const map = L.map('map').setView([-0.3031, 36.0800], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap',
        maxZoom: 18
    }).addTo(map);

    // ---- Global state ----
    let currentTab = 'land';
    let allData = {};               // { land: [...], health: [...], ... }
    let activeLayers = {            // layer groups for each tab
        land: { heat: null, markers: null, subcounty: null, wards: null },
        health: { markers: null },
        schools: { markers: null },
        water: { markers: null }
    };
    let avgPrices = {};
    let isRunning = false;
    const propertyList = document.getElementById('property-list');
    const countBadge = document.getElementById('count-badge');
    const searchInput = document.getElementById('searchInput');
    const toastEl = document.getElementById('toast');
    const refreshBtn = document.getElementById('refreshBtn');
    const legendContainer = document.getElementById('legend-container');

    // ============================================================
    // HELPERS
    // ============================================================
    function showToast(msg, type) {
        type = type || '';
        toastEl.textContent = msg;
        toastEl.className = 'toast show ' + type;
        clearTimeout(toastEl._timer);
        toastEl._timer = setTimeout(() => { toastEl.className = 'toast'; }, 4000);
    }

    function setStatus(status, message) {
        document.getElementById('statusBadge').className = 'status-badge ' + status;
        document.getElementById('statusLabel').textContent = message;
    }

    function getSize(record) {
        const fields = ['size_ha', 'size', 'area', 'area_ha', 'size_ha_', 'area_ha_'];
        for (let f of fields) {
            if (record[f] !== undefined && record[f] !== null) {
                const val = parseFloat(record[f]);
                if (!isNaN(val) && val > 0) return val;
            }
        }
        return null;
    }

    // ============================================================
    // RENDER LIST
    // ============================================================
    function renderList(data, tab) {
        const isLand = (tab === 'land');
        let html = '';
        if (!data || data.length === 0) {
            html = '<div style="padding:30px 20px;text-align:center;color:#94a3b8;font-size:14px;">No data found.</div>';
        } else {
            data.forEach((p, index) => {
                const priceStr = p.price ? 'KSh ' + Number(p.price).toLocaleString() : 'N/A';
                const sizeStr = p.size_ha ? p.size_ha.toFixed(2) + ' Ha' : '—';
                const title = p.title || 'Untitled';
                const location = p.location || 'Nakuru';
                const source = p.source || '';

                html += `
                    <div class="property-item" data-index="${index}" onclick="zoomToProperty(${index}, '${tab}')">
                        <div class="info">
                            <div class="title">${title}</div>
                            <div class="meta">
                                <span>${location}</span>
                                <span>${sizeStr}</span>
                                ${source ? `<span class="source-tag">${source}</span>` : ''}
                            </div>
                        </div>
                        <div class="price">${priceStr}</div>
                    </div>
                `;
            });
        }
        propertyList.innerHTML = html;
        countBadge.textContent = data.length + ' ' + (isLand ? 'plots' : 'records');
    }

    // ============================================================
    // ZOOM TO PROPERTY
    // ============================================================
    function zoomToProperty(index, tab) {
        const data = allData[tab] || [];
        const p = data[index];
        if (!p || !p.lat || !p.lng) return;
        map.setView([p.lat, p.lng], 16);
        const layerGroup = activeLayers[tab]?.markers;
        if (layerGroup) {
            layerGroup.eachLayer((layer) => {
                if (layer._latlng && layer._latlng.lat === p.lat && layer._latlng.lng === p.lng) {
                    layer.openPopup();
                }
            });
        }
        const items = propertyList.querySelectorAll('.property-item');
        items.forEach((el, i) => el.classList.toggle('active', i === index));
    }

    // ============================================================
    // FILTER
    // ============================================================
    function filterList() {
        const query = searchInput.value.toLowerCase().trim();
        const data = allData[currentTab] || [];
        if (!query) {
            renderList(data, currentTab);
            return;
        }
        const filtered = data.filter(p => {
            const title = (p.title || '').toLowerCase();
            const location = (p.location || '').toLowerCase();
            const source = (p.source || '').toLowerCase();
            return title.includes(query) || location.includes(query) || source.includes(query);
        });
        renderList(filtered, currentTab);
    }

    // ============================================================
    // LOAD BOUNDARIES (Sub-county + Wards)
    // ============================================================
    async function loadBoundaries() {
        // Same as before – we'll keep it as is
        try {
            const subRes = await fetch('/nakuru_subcounties.geojson');
            if (!subRes.ok) {
                console.warn('Sub-county GeoJSON not found (404)');
            } else {
                const subData = await subRes.json();
                console.log('Sub-county features:', subData.features.length);
                if (activeLayers.land.subcounty) map.removeLayer(activeLayers.land.subcounty);

                const prices = Object.values(avgPrices).filter(p => p > 0);
                const maxPrice = Math.max(...prices, 1);
                const colorScale = chroma.scale(['#e0f2fe', '#0284c7', '#f97316', '#dc2626']).domain([0, maxPrice]);

                const style = (feature) => {
                    const name = feature.properties?.NAME || feature.properties?.name || feature.properties?.SubCounty || '';
                    const price = avgPrices[name] || 0;
                    return {
                        fillColor: price > 0 ? colorScale(price).hex() : '#f1f5f9',
                        fillOpacity: 0.5,
                        weight: 2,
                        color: '#0f172a',
                        opacity: 1.0
                    };
                };

                const onEachFeature = (feature, layer) => {
                    const name = feature.properties?.NAME || feature.properties?.name || feature.properties?.SubCounty || 'Unknown';
                    const price = avgPrices[name] || 0;
                    const count = avgPrices[name + '_count'] || 0;
                    layer.bindPopup(`
                        <div style="font-family: sans-serif; min-width: 180px;">
                            <strong>${name}</strong><br/>
                            <span style="color: #555;">
                                Avg price/ha: <strong>KSh ${price.toLocaleString()}</strong><br/>
                                Listings: ${count}
                            </span>
                            ${price === 0 ? '<br/><em style="color:#999;">No data</em>' : ''}
                        </div>
                    `);
                };

                activeLayers.land.subcounty = L.geoJSON(subData, { style, onEachFeature });
                activeLayers.land.subcounty.setZIndex(0);
                if (currentTab === 'land') activeLayers.land.subcounty.addTo(map);

                // Legend
                const legendHtml = `
                    <div class="legend">
                        <div class="title">Avg Price / Ha</div>
                        <div class="gradient" style="background: linear-gradient(to right, ${colorScale(0).hex()}, ${colorScale(maxPrice).hex()});"></div>
                        <div class="labels">
                            <span>KSh 0</span>
                            <span>KSh ${Math.round(maxPrice).toLocaleString()}</span>
                        </div>
                    </div>
                `;
                legendContainer.innerHTML = legendHtml;
            }

            // Wards
            const wardRes = await fetch('/nakuru_ward.geojson');
            if (!wardRes.ok) {
                console.warn('Ward GeoJSON not found (404)');
            } else {
                const wardData = await wardRes.json();
                console.log('Ward features:', wardData.features.length);
                if (activeLayers.land.wards) map.removeLayer(activeLayers.land.wards);
                activeLayers.land.wards = L.geoJSON(wardData, {
                    style: {
                        fill: false,
                        weight: 4,
                        color: '#ff0000',
                        dashArray: null,
                        opacity: 1.0
                    },
                    onEachFeature: (feature, layer) => {
                        const name = feature.properties?.NAME || feature.properties?.name || 'Ward';
                        layer.bindPopup('<strong>' + name + '</strong><br/>Ward boundary');
                        layer.bindTooltip(name, { permanent: false, direction: 'center' });
                    }
                });
                activeLayers.land.wards.setZIndex(1000);
                activeLayers.land.wards.bringToFront();
                if (currentTab === 'land') activeLayers.land.wards.addTo(map);

                const bounds = activeLayers.land.wards.getBounds();
                if (bounds.isValid()) {
                    map.fitBounds(bounds, { padding: [50, 50] });
                }
            }

            // Layer control (toggle)
            const overlayControl = {
                "Sub-counties (price)": activeLayers.land.subcounty,
                "Wards (outlines)": activeLayers.land.wards
            };
            if (window._layerControl) map.removeControl(window._layerControl);
            window._layerControl = L.control.layers(null, overlayControl, { collapsed: false }).addTo(map);

            console.log('✅ Choropleth + wards loaded');
        } catch (err) {
            console.error('Error loading boundaries:', err);
        }
    }

    // ============================================================
    // SWITCH TAB
    // ============================================================
    function switchTab(tab) {
        currentTab = tab;
        // Update active button
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.tab === tab);
        });
        // Remove all layers except base map
        for (const key in activeLayers) {
            for (const layerKey in activeLayers[key]) {
                const layer = activeLayers[key][layerKey];
                if (layer && map.hasLayer(layer)) {
                    map.removeLayer(layer);
                }
            }
        }
        // Show layers for this tab
        const layers = activeLayers[tab];
        for (const layerKey in layers) {
            const layer = layers[layerKey];
            if (layer && !map.hasLayer(layer)) {
                layer.addTo(map);
            }
        }
        // Render list
        const data = allData[tab] || [];
        renderList(data, tab);
        // Search
        searchInput.value = '';
        // Legend: show only for land
        if (tab === 'land' && legendContainer.innerHTML) {
            legendContainer.style.display = 'block';
        } else {
            legendContainer.style.display = 'none';
        }
    }

    // ============================================================
    // LOAD DATA FOR A TAB (from Supabase)
    // ============================================================
    async function loadTabData(tab) {
        let tableName, fields;
        if (tab === 'land') {
            tableName = 'listings';
            fields = '*';
        } else if (tab === 'health') {
            tableName = 'health_facilities';   // placeholder – we'll create this table later
            fields = '*';
        } else if (tab === 'schools') {
            tableName = 'schools';
            fields = '*';
        } else if (tab === 'water') {
            tableName = 'water_sources';
            fields = '*';
        } else {
            return [];
        }

        try {
            const { data, error } = await supabase
                .from(tableName)
                .select(fields)
                .not('latitude', 'is', null)
                .limit(1000);
            if (error) throw error;
            return data || [];
        } catch (err) {
            console.warn(`Error loading ${tab}:`, err);
            return [];
        }
    }

    // ============================================================
    // REFRESH ALL DATA
    // ============================================================
    async function refreshMap() {
        if (isRunning) return;
        isRunning = true;
        setStatus('running', 'Refreshing…');
        showToast('Refreshing data…', 'info');
        refreshBtn.disabled = true;
        refreshBtn.innerHTML = 'Loading…';

        try {
            // For now, only land table exists. We'll add placeholders for others.
            const landData = await loadTabData('land');
            allData.land = landData;

            // Compute avgPrices for land (sub-county aggregation)
            const groups = {};
            landData.forEach(item => {
                const key = item.location ? item.location.replace(/ County$/i, '').trim() : 'Nakuru';
                if (!groups[key]) groups[key] = { prices: [], sizes: [], count: 0 };
                const size = getSize(item);
                if (item.price && size && size > 0) {
                    groups[key].prices.push(item.price);
                    groups[key].sizes.push(size);
                }
                groups[key].count += 1;
            });
            const avg = {};
            Object.keys(groups).forEach(key => {
                const g = groups[key];
                if (g.prices.length === 0) {
                    avg[key] = 0;
                } else {
                    const perHa = g.prices.map((p, i) => p / g.sizes[i]);
                    avg[key] = perHa.reduce((a, b) => a + b, 0) / perHa.length;
                }
                avg[key + '_count'] = g.count;
            });
            avgPrices = avg;
            console.log('Avg prices:', avgPrices);

            // Build heatmap & markers for land
            const points = [];
            const markerData = [];
            landData.forEach(item => {
                const size = getSize(item);
                if (item.latitude && item.longitude && item.price) {
                    const pricePerHa = (size && size > 0) ? item.price / size : 0;
                    const intensity = Math.min(pricePerHa / 1000000, 1);
                    if (size && size > 0) {
                        points.push([item.latitude, item.longitude, intensity]);
                    }
                    markerData.push({
                        lat: item.latitude,
                        lng: item.longitude,
                        title: item.title || 'Plot',
                        price: item.price,
                        size_ha: size,
                        location: item.location || 'Nakuru',
                        source: item.source || '',
                        pricePerHa: pricePerHa
                    });
                }
            });

            // Remove old land layers
            if (activeLayers.land.heat) map.removeLayer(activeLayers.land.heat);
            if (activeLayers.land.markers) map.removeLayer(activeLayers.land.markers);

            // Heatmap
            if (points.length > 0) {
                activeLayers.land.heat = L.heatLayer(points, {
                    radius: 35,
                    blur: 20,
                    maxZoom: 15,
                    gradient: {
                        0.1: '#22c55e',
                        0.3: '#84cc16',
                        0.5: '#eab308',
                        0.7: '#f97316',
                        0.9: '#ef4444'
                    }
                });
            }

            // Markers
            activeLayers.land.markers = L.layerGroup();
            markerData.forEach(m => {
                const popupContent = '<b>' + m.title + '</b>' +
                    '<br><b>Price:</b> KSh ' + m.price.toLocaleString() +
                    (m.size_ha ? '<br><b>Size:</b> ' + m.size_ha.toFixed(2) + ' Ha' : '') +
                    (m.pricePerHa > 0 ? '<br><b>Price/Ha:</b> KSh ' + Math.round(m.pricePerHa).toLocaleString() : '') +
                    (m.location ? '<br><b>Location:</b> ' + m.location : '');
                const circle = L.circleMarker([m.lat, m.lng], {
                    radius: 5,
                    color: '#2563eb',
                    fillColor: '#2563eb',
                    fillOpacity: 0.4,
                    weight: 1.5
                }).bindPopup(popupContent);
                activeLayers.land.markers.addLayer(circle);
            });

            // Also store marker data for list
            allData.land = markerData;  // replace with markerData for display

            // Load boundaries (sub-county + wards)
            await loadBoundaries();

            // Switch to current tab
            switchTab(currentTab);

            // Fit bounds if we have points
            if (points.length > 0) {
                const bounds = L.latLngBounds(points.map(p => [p[0], p[1]]));
                map.fitBounds(bounds, { padding: [50, 50] });
            }

            showToast('Loaded ' + landData.length + ' plots', 'success');

        } catch (err) {
            console.error(err);
            showToast('Error loading data', 'error');
        }

        isRunning = false;
        setStatus('idle', 'Idle');
        refreshBtn.disabled = false;
        refreshBtn.innerHTML = 'Refresh';
    }

    // ============================================================
    // EXPORT FUNCTIONS
    // ============================================================
    function exportPNG() {
        leafletImage(map, function(err, canvas) {
            if (err) { showToast('Error exporting PNG', 'error'); return; }
            const link = document.createElement('a');
            link.download = currentTab + '_map.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }

    function exportPDF() {
        // Capture map + sidebar using html2canvas
        const element = document.querySelector('#sidebar');
        html2canvas(element, { scale: 2 }).then(canvas => {
            const imgData = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('landscape', 'mm', 'a4');
            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = pdf.internal.pageSize.getHeight();
            pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
            pdf.save(currentTab + '_dashboard.pdf');
        }).catch(err => {
            showToast('Error generating PDF', 'error');
        });
    }

    function exportCSV() {
        const data = allData[currentTab] || [];
        if (data.length === 0) { showToast('No data to export', 'info'); return; }
        const headers = Object.keys(data[0]);
        let csv = headers.join(',') + '\n';
        data.forEach(row => {
            const values = headers.map(h => {
                let val = row[h] || '';
                if (typeof val === 'string' && (val.includes(',') || val.includes('"'))) {
                    val = '"' + val.replace(/"/g, '""') + '"';
                }
                return val;
            });
            csv += values.join(',') + '\n';
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const link = document.createElement('a');
        link.download = currentTab + '_data.csv';
        link.href = URL.createObjectURL(blob);
        link.click();
    }

    function exportGeoJSON() {
        const data = allData[currentTab] || [];
        if (data.length === 0) { showToast('No data to export', 'info'); return; }
        const features = data.map(item => ({
            type: 'Feature',
            geometry: {
                type: 'Point',
                coordinates: [item.lng, item.lat]
            },
            properties: { ...item }
        }));
        const geojson = { type: 'FeatureCollection', features };
        const blob = new Blob([JSON.stringify(geojson, null, 2)], { type: 'application/json' });
        const link = document.createElement('a');
        link.download = currentTab + '_data.geojson';
        link.href = URL.createObjectURL(blob);
        link.click();
    }

    // ============================================================
    // INIT
    // ============================================================
    // Tab click listeners
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            switchTab(btn.dataset.tab);
        });
    });

    searchInput.addEventListener('input', filterList);

    // Load default tab (land)
    refreshMap();

    // Auto-refresh every 5 minutes
    setInterval(() => { if (!isRunning) refreshMap(); }, 300000);
</script>
</body>
</html>
