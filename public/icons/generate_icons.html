<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Generate PWA Icons</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            gap: 20px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            text-align: center;
        }
        .preview {
            display: flex;
            gap: 40px;
            justify-content: center;
            margin: 20px 0;
        }
        .preview img {
            border: 1px solid #ddd;
            border-radius: 12px;
        }
        button {
            background: #1e40af;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 4px;
        }
        button:hover {
            background: #1e3a5f;
        }
        .note {
            color: #475569;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>📱 Generate PWA Icons</h2>
    <p>Click each button to download the PNG file – then place them in your <code>public/icons/</code> folder.</p>

    <div class="preview">
        <div>
            <img id="preview192" width="96" height="96" alt="192 preview" />
            <br/><small>192×192</small>
        </div>
        <div>
            <img id="preview512" width="96" height="96" alt="512 preview" />
            <br/><small>512×512</small>
        </div>
    </div>

    <div>
        <button onclick="downloadIcon(192)">⬇ Download 192×192</button>
        <button onclick="downloadIcon(512)">⬇ Download 512×512</button>
    </div>

    <p class="note">After downloading, copy both files to <code>public/icons/</code></p>
</div>

<script>
    function drawIcon(size) {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        // --- Background: gradient (dark blue → green) with rounded corners ---
        const radius = size * 0.15;
        const grd = ctx.createLinearGradient(0, 0, size, size);
        grd.addColorStop(0, '#1e40af');   // dark blue (accent)
        grd.addColorStop(1, '#0d9488');   // teal green
        ctx.beginPath();
        ctx.moveTo(radius, 0);
        ctx.lineTo(size - radius, 0);
        ctx.quadraticCurveTo(size, 0, size, radius);
        ctx.lineTo(size, size - radius);
        ctx.quadraticCurveTo(size, size, size - radius, size);
        ctx.lineTo(radius, size);
        ctx.quadraticCurveTo(0, size, 0, size - radius);
        ctx.lineTo(0, radius);
        ctx.quadraticCurveTo(0, 0, radius, 0);
        ctx.closePath();
        ctx.fillStyle = grd;
        ctx.fill();

        // --- Outer ring (lighter) ---
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = size * 0.03;
        ctx.stroke();

        // --- Map pin icon (simple shape) ---
        const pinSize = size * 0.55;
        const cx = size / 2;
        const cy = size / 2 + size * 0.06;

        // Pin body (circle + triangle bottom)
        ctx.shadowColor = 'rgba(0,0,0,0.2)';
        ctx.shadowBlur = size * 0.05;
        ctx.beginPath();
        ctx.arc(cx, cy - pinSize * 0.2, pinSize * 0.4, 0, Math.PI * 2);
        ctx.fillStyle = 'white';
        ctx.fill();

        // Pin point (triangle)
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.moveTo(cx - pinSize * 0.25, cy + pinSize * 0.15);
        ctx.lineTo(cx, cy + pinSize * 0.55);
        ctx.lineTo(cx + pinSize * 0.25, cy + pinSize * 0.15);
        ctx.closePath();
        ctx.fillStyle = 'white';
        ctx.fill();

        // --- "N" text inside the pin ---
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#1e40af';
        ctx.font = `bold ${pinSize * 0.55}px 'Georgia', 'Times New Roman', serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('N', cx, cy - pinSize * 0.2);

        // --- Small "INFO" below the pin ---
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.font = `${size * 0.055}px 'Inter', sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText('INFO', cx, size - size * 0.06);

        return canvas;
    }

    function downloadIcon(size) {
        const canvas = drawIcon(size);
        const link = document.createElement('a');
        link.download = `icon-${size}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();

        // Update preview
        const preview = document.getElementById(`preview${size}`);
        preview.src = canvas.toDataURL('image/png');
    }

    // Preload previews
    window.onload = function() {
        document.getElementById('preview192').src = drawIcon(192).toDataURL('image/png');
        document.getElementById('preview512').src = drawIcon(512).toDataURL('image/png');
    };
</script>

</body>
</html>
