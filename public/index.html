<script>
    // ============================================================
    // CONFIGURATION
    // ============================================================
    const SUPABASE_URL = 'https://oeaoglqrojkexfovrwgl.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9lYW9nbHFyb2prZXhmb3Zyd2dsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMDcyMzYsImV4cCI6MjEwMTY4MzIzNn0.k3DVFFyWwaSCxra2WipcKr1CDJ6eQ2dVELcBAbmFJu8';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const map = L.map('map').setView([-0.3031, 36.0800], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 18 }).addTo(map);

    // ============================================================
    // HELPERS
    // ============================================================
    function showToast(msg, type) {
        type = type || '';
        const toastEl = document.getElementById('toast');
        toastEl.textContent = msg;
        toastEl.className = 'toast show ' + type;
        clearTimeout(toastEl._timer);
        toastEl._timer = setTimeout(() => { toastEl.className = 'toast'; }, 4000);
    }

    function setStatus(status, message) {
        document.getElementById('statusBadge').className = 'status-badge ' + status;
        document.getElementById('statusLabel').textContent = message;
    }

    function getSize(record) {
        const fields = ['size_ha', 'size', 'area', 'area_ha', 'size_ha_', 'area_ha_'];
        for (let f of fields) {
            if (record[f] !== undefined && record[f] !== null) {
                const val = parseFloat(record[f]);
                if (!isNaN(val) && val > 0) return val;
            }
        }
        return null;
    }

    function median(arr) {
        if (arr.length === 0) return 0;
        const sorted = arr.slice().sort((a,b) => a - b);
        const mid = Math.floor(sorted.length / 2);
        if (sorted.length % 2 === 0) return (sorted[mid-1] + sorted[mid]) / 2;
        return sorted[mid];
    }

    // ---- Helper: extract lat/lng from geometry ----
    function getCoordsFromGeometry(geom) {
        if (!geom) return null;
        if (geom.type === 'Point' && geom.coordinates) {
            return { lng: geom.coordinates[0], lat: geom.coordinates[1] };
        }
        if (typeof geom === 'string') {
            const match = geom.match(/POINT\(([^ ]+) ([^)]+)\)/);
            if (match) {
                return { lng: parseFloat(match[1]), lat: parseFloat(match[2]) };
            }
        }
        return null;
    }

    // ============================================================
    // DARK MODE & SIDEBAR TOGGLE
    // ============================================================
    const darkToggle = document.getElementById('darkModeToggle');
    darkToggle.addEventListener('click', () => {
        const html = document.documentElement;
        const isDark = html.getAttribute('data-theme') === 'dark';
        html.setAttribute('data-theme', isDark ? 'light' : 'dark');
        darkToggle.innerHTML = isDark ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
        setTimeout(() => map.invalidateSize(), 100);
    });

    let sidebarVisible = true;
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        sidebarVisible = !sidebarVisible;
        sidebar.style.display = sidebarVisible ? 'flex' : 'none';
        const btn = document.getElementById('sidebarToggle');
        btn.innerHTML = sidebarVisible ? '<i class="fas fa-bars"></i>' : '<i class="fas fa-chevron-right"></i>';
        setTimeout(() => map.invalidateSize(), 300);
    }

    // ============================================================
    // ADD POINT – dynamic form with manual lat/lng and location
    // ============================================================
    let addPointMode = false;
    let clickLat = null;
    let clickLng = null;

    function toggleAddPoint() {
        addPointMode = !addPointMode;
        const btn = document.getElementById('addPointBtn');
        btn.classList.toggle('adding', addPointMode);
        btn.innerHTML = addPointMode ? '<i class="fas fa-times"></i>' : '<i class="fas fa-plus-circle"></i>';
        if (addPointMode) {
            map.on('click', onMapClick);
            showToast('Click on the map to set coordinates, or fill them manually in the form.', 'info');
        } else {
            map.off('click', onMapClick);
        }
    }

    function onMapClick(e) {
        if (!addPointMode) return;
        clickLat = e.latlng.lat;
        clickLng = e.latlng.lng;
        const latField = document.getElementById('addLat');
        const lngField = document.getElementById('addLng');
        if (latField && lngField) {
            latField.value = clickLat.toFixed(6);
            lngField.value = clickLng.toFixed(6);
            showToast('Coordinates set from map click', 'success');
        } else {
            showAddPointForm(clickLat, clickLng);
        }
    }

    function showAddPointForm(lat, lng) {
        clickLat = lat;
        clickLng = lng;
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.id = 'addPointModalOverlay';
        overlay.innerHTML = `
            <div class="modal-box">
                <h3>Add New Point</h3>
                <p style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">
                    Click on the map to set coordinates, or enter them manually.
                </p>
                <select id="addType" onchange="togglePointForm()">
                    <option value="land">Land</option>
                    <option value="health">Health Facility</option>
                </select>

                <!-- Land fields -->
                <div id="landFields" class="form-group-land active">
                    <input id="addTitle" placeholder="Title *" />
                    <input id="addPrice" placeholder="Price (KSh) *" type="number" />
                    <input id="addSize" placeholder="Size (Ha) *" type="number" step="0.01" />
                    <input id="addLocation" placeholder="Location (address/area) *" />
                    <textarea id="addDescription" placeholder="Description" rows="3"></textarea>
                    <div style="display:flex;gap:6px;">
                        <input id="addLat" placeholder="Latitude (optional)" type="number" step="any" value="${lat.toFixed(6)}" style="flex:1;" />
                        <input id="addLng" placeholder="Longitude (optional)" type="number" step="any" value="${lng.toFixed(6)}" style="flex:1;" />
                    </div>
                </div>

                <!-- Health fields -->
                <div id="healthFields" class="form-group-health">
                    <input id="addHealthName" placeholder="Name *" />
                    <input id="addHealthType" placeholder="Facility Type *" />
                    <input id="addHealthOperator" placeholder="Operator *" />
                    <input id="addHealthWard" placeholder="Ward *" />
                    <input id="addHealthSubCounty" placeholder="Sub-County *" />
                    <input id="addHealthTown" placeholder="Town" />
                    <input id="addHealthBeds" placeholder="Bed Capacity" type="number" />
                    <input id="addHealthLocation" placeholder="Location (address/area) *" />
                    <textarea id="addHealthDescription" placeholder="Description" rows="3"></textarea>
                    <div style="display:flex;gap:6px;">
                        <input id="addHealthLat" placeholder="Latitude (optional)" type="number" step="any" value="${lat.toFixed(6)}" style="flex:1;" />
                        <input id="addHealthLng" placeholder="Longitude (optional)" type="number" step="any" value="${lng.toFixed(6)}" style="flex:1;" />
                    </div>
                </div>

                <div class="btn-row">
                    <button class="submit" onclick="submitContribution()">Submit</button>
                    <button class="cancel" onclick="closeModal()">Cancel</button>
                </div>
            </div>
        `;
        document.body.appendChild(overlay);
        togglePointForm();
    }

    function togglePointForm() {
        const type = document.getElementById('addType').value;
        const landGroup = document.getElementById('landFields');
        const healthGroup = document.getElementById('healthFields');
        landGroup.classList.toggle('active', type === 'land');
        healthGroup.classList.toggle('active', type === 'health');
    }

    function closeModal() {
        const overlay = document.getElementById('addPointModalOverlay');
        if (overlay) overlay.remove();
        addPointMode = false;
        const btn = document.getElementById('addPointBtn');
        btn.classList.remove('adding');
        btn.innerHTML = '<i class="fas fa-plus-circle"></i>';
        map.off('click', onMapClick);
        clickLat = null;
        clickLng = null;
    }

    async function submitContribution() {
        const type = document.getElementById('addType').value;

        let properties = {};
        let lat, lng;
        let errorMsg = '';

        if (type === 'land') {
            const title = document.getElementById('addTitle').value.trim();
            const price = parseFloat(document.getElementById('addPrice').value);
            const size = parseFloat(document.getElementById('addSize').value);
            const location = document.getElementById('addLocation').value.trim();
            const description = document.getElementById('addDescription').value.trim();
            const latInput = document.getElementById('addLat').value.trim();
            const lngInput = document.getElementById('addLng').value.trim();

            if (!title || !price || !size || !location) {
                showToast('Please fill all required fields (Title, Price, Size, Location).', 'error');
                return;
            }
            lat = latInput ? parseFloat(latInput) : clickLat;
            lng = lngInput ? parseFloat(lngInput) : clickLng;
            if (!lat || !lng || isNaN(lat) || isNaN(lng)) {
                showToast('Please click on the map or enter valid coordinates.', 'error');
                return;
            }
            properties = { title, price, size_ha: size, location, description };
        } else {
            // Health
            const name = document.getElementById('addHealthName').value.trim();
            const facility_type = document.getElementById('addHealthType').value.trim();
            const operator = document.getElementById('addHealthOperator').value.trim();
            const ward = document.getElementById('addHealthWard').value.trim();
            const sub_county = document.getElementById('addHealthSubCounty').value.trim();
            const town = document.getElementById('addHealthTown').value.trim();
            const bed_capacity = parseInt(document.getElementById('addHealthBeds').value) || null;
            const location = document.getElementById('addHealthLocation').value.trim();
            const description = document.getElementById('addHealthDescription').value.trim();
            const latInput = document.getElementById('addHealthLat').value.trim();
            const lngInput = document.getElementById('addHealthLng').value.trim();

            if (!name || !facility_type || !operator || !ward || !sub_county || !location) {
                showToast('Please fill all required health fields (Name, Type, Operator, Ward, Sub-County, Location).', 'error');
                return;
            }
            lat = latInput ? parseFloat(latInput) : clickLat;
            lng = lngInput ? parseFloat(lngInput) : clickLng;
            if (!lat || !lng || isNaN(lat) || isNaN(lng)) {
                showToast('Please click on the map or enter valid coordinates.', 'error');
                return;
            }
            properties = {
                name,
                facility_type,
                operator,
                ward,
                sub_county,
                town: town || null,
                bed_capacity,
                location,
                description,
                source: 'user_contribution'
            };
        }

        const geometry = `POINT(${lng} ${lat})`;

        const { data, error } = await supabaseClient
            .from('user_contributions')
            .insert({
                user_id: null,
                type: type,
                geometry: geometry,
                properties: properties
            });

        if (error) {
            showToast('Error submitting: ' + error.message, 'error');
            console.error(error);
        } else {
            showToast('Point added successfully!', 'success');
            closeModal();
            refreshMap();
        }
    }

    // ============================================================
    // DELETE CONTRIBUTION
    // ============================================================
    async function deleteContribution(id, event) {
        if (event) event.stopPropagation();
        if (!confirm('Delete this contribution permanently?')) return;
        const { error } = await supabaseClient
            .from('user_contributions')
            .delete()
            .eq('id', id);
        if (error) {
            showToast('Error deleting: ' + error.message, 'error');
        } else {
            showToast('Deleted successfully', 'success');
            refreshMap();
        }
    }

    // ============================================================
    // COMMENTS – anonymous
    // ============================================================
    async function loadComments(targetType, targetId, container) {
        if (!container) return;
        const { data, error } = await supabaseClient
            .from('comments')
            .select('*')
            .eq('target_type', targetType)
            .eq('target_id', targetId)
            .order('created_at', { ascending: true });
        if (error) {
            container.innerHTML = '<div style="color:var(--text-muted);font-size:12px;">Could not load comments.</div>';
            return;
        }
        let html = data.map(c => `
            <div style="border-bottom:1px solid var(--border);padding:4px 0;font-size:12px;">
                <strong>Anonymous</strong>: ${c.comment_text}
                <span style="color:var(--text-muted);font-size:10px;display:block;">${new Date(c.created_at).toLocaleString()}</span>
            </div>
        `).join('');
        if (!html) html = '<div style="color:var(--text-muted);font-size:12px;">No comments yet.</div>';
        container.innerHTML = html;

        const form = document.createElement('div');
        form.style.marginTop = '6px';
        form.innerHTML = `
            <div style="display:flex;gap:4px;">
                <input id="commentInput_${targetType}_${targetId}" placeholder="Add a comment..." style="flex:1;padding:4px;border:1px solid var(--input-border);border-radius:4px;background:var(--input-bg);color:var(--text-primary);font-size:12px;" />
                <button onclick="addComment('${targetType}', ${targetId})" style="padding:4px 10px;background:var(--accent);color:white;border:none;border-radius:4px;cursor:pointer;font-size:12px;">Post</button>
            </div>
        `;
        container.appendChild(form);
    }

    async function addComment(targetType, targetId) {
        const input = document.getElementById(`commentInput_${targetType}_${targetId}`);
        if (!input) return;
        const text = input.value.trim();
        if (!text) return;
        const { error } = await supabaseClient
            .from('comments')
            .insert({
                user_id: null,
                target_type: targetType,
                target_id: targetId,
                comment_text: text
            });
        if (error) {
            showToast('Error posting comment: ' + error.message, 'error');
        } else {
            showToast('Comment added', 'success');
            refreshMap();
        }
    }

    // ============================================================
    // POPUP BUILDERS (with comments placeholder)
    // ============================================================
    function buildHealthPopup(f) {
        const fields = [
            ['Name', 'name'],
            ['Type', 'facility_type'],
            ['Operator', 'operator'],
            ['Ward', 'ward'],
            ['Sub-county', 'sub_county'],
            ['Town', 'town'],
            ['Level', 'keph_level'],
            ['Beds', 'bed_capacity'],
            ['Regulatory Status', 'regul_status'],
            ['Description', 'description'],
            ['Landmark', 'landmark']
        ];
        let html = `<div style="min-width:220px; font-family:sans-serif;"><strong>${f.name || 'Unnamed'}</strong><br/>`;
        fields.forEach(([label, key]) => {
            const val = f[key];
            if (val !== undefined && val !== null && val !== '') {
                html += `<b>${label}:</b> ${val}<br/>`;
            }
        });
        html += `<hr style="margin:4px 0;border-color:var(--border);"/>`;
        html += `<div id="comments_health_${f.id}">Loading comments...</div>`;
        html += '</div>';
        return html;
    }

    function buildLandPopup(item) {
        let html = `<b>${item.title || 'Untitled'}</b><br/>
                <b>Price:</b> KSh ${(item.price || 0).toLocaleString()}<br/>`;
        if (item.size_ha) {
            const pricePerHa = item.price / item.size_ha;
            html += `<b>Price/ha:</b> KSh ${Math.round(pricePerHa).toLocaleString()}<br/>`;
            html += `<b>Size:</b> ${item.size_ha.toFixed(2)} Ha<br/>`;
        }
        if (item.location) html += `<b>Location:</b> ${item.location}<br/>`;
        if (item.source) html += `<b>Source:</b> ${item.source}`;
        html += `<hr style="margin:4px 0;border-color:var(--border);"/>`;
        const id = item.id || item.listing_id || 0;
        html += `<div id="comments_listing_${id}">Loading comments...</div>`;
        return html;
    }

    map.on('popupopen', function(e) {
        const popup = e.popup;
        const container = popup._contentNode;
        if (!container) return;
        const commentDivs = container.querySelectorAll('[id^="comments_"]');
        commentDivs.forEach(div => {
            const idParts = div.id.split('_');
            const targetType = idParts[1];
            const targetId = parseInt(idParts[2]);
            if (!targetId) return;
            let realType = targetType === 'health' ? 'health_facility' : 'listing';
            if (targetType === 'user') realType = 'user_contribution';
            loadComments(realType, targetId, div);
        });
    });

    // ============================================================
    // GLOBAL STATE
    // ============================================================
    let currentTab = 'land';
    let allData = {};
    let activeLayers = {
        land: { heat: null, markers: null, subcounty: null, wards: null },
        health: { markers: null },
        schools: { markers: null },
        water: { markers: null },
        userContributions: null
    };
    let subCountyStats = {};
    let currentStat = 'median';
    let isRunning = false;
    const propertyList = document.getElementById('property-list');
    const defaultList = document.getElementById('default-list');
    const healthDashboard = document.getElementById('health-dashboard');
    const searchInput = document.getElementById('searchInput');
    const toastEl = document.getElementById('toast');
    const refreshBtn = document.getElementById('refreshBtn');
    const legendContainer = document.getElementById('legend-container');
    const statSelect = document.getElementById('statSelect');
    const countBadge = document.getElementById('count-badge');

    // Health specific
    let healthFilter = null;
    let healthMarkers = [];
    let pieChart = null;
    let barChart = null;

    // ============================================================
    // RENDER LAND LIST (with user contributions & delete button)
    // ============================================================
    function renderLandList(data) {
        let html = '';
        if (!data || data.length === 0) {
            html = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px;">No data found.</div>';
        } else {
            data.forEach((p, index) => {
                const title = p.title || 'Untitled';
                const location = p.location || 'Nakuru';
                const sizeStr = p.size_ha ? p.size_ha.toFixed(2) + ' Ha' : '—';
                let priceHtml = p.price ? `KSh ${Number(p.price).toLocaleString()}` : 'N/A';
                if (p.size_ha && p.price) {
                    const ppHa = p.price / p.size_ha;
                    priceHtml += ` <small>KSh ${Math.round(ppHa).toLocaleString()}/ha</small>`;
                }
                const userTag = p.isUserContribution ? `<span class="user-tag">User</span>` : '';
                const deleteBtn = p.isUserContribution ? `<button class="delete-btn" onclick="deleteContribution(${p.id}, event)"><i class="fas fa-trash-alt"></i></button>` : '';
                html += `
                    <div class="property-item" data-index="${index}" onclick="zoomToProperty(${index}, 'land')">
                        <div class="info">
                            <div class="title">${title} ${userTag}</div>
                            <div class="meta"><span>${location}</span><span>${sizeStr}</span></div>
                        </div>
                        <div class="price">${priceHtml} ${deleteBtn}</div>
                    </div>
                `;
            });
        }
        defaultList.innerHTML = html;
        if (countBadge) countBadge.textContent = data.length + ' plots';
    }

    // ============================================================
    // RENDER HEALTH LIST (with user contributions & delete button)
    // ============================================================
    function renderHealthList(data) {
        let html = '';
        if (!data || data.length === 0) {
            html = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px;">No facilities found.</div>';
        } else {
            data.forEach((p, index) => {
                const title = p.name || 'Unnamed';
                const type = p.facility_type || '—';
                const ward = p.ward || '—';
                const owner = p.operator || '—';
                const beds = p.bed_capacity ? `${p.bed_capacity} beds` : '';
                const userTag = p.isUserContribution ? `<span class="user-tag">User</span>` : '';
                const deleteBtn = p.isUserContribution ? `<button class="delete-btn" onclick="deleteContribution(${p.id}, event)"><i class="fas fa-trash-alt"></i></button>` : '';
                html += `
                    <div class="property-item" data-index="${index}" onclick="zoomToProperty(${index}, 'health')">
                        <div class="info">
                            <div class="title">${title} ${userTag}</div>
                            <div class="meta"><span>${type}</span><span>${ward}</span><span>${owner}</span></div>
                        </div>
                        <div class="price">${beds} ${deleteBtn}</div>
                    </div>
                `;
            });
        }
        propertyList.innerHTML = html;
        if (countBadge) countBadge.textContent = data.length + ' facilities';
    }

    // ============================================================
    // ZOOM TO PROPERTY
    // ============================================================
    function zoomToProperty(index, tab) {
        const data = tab === 'land' ? allData.land : allData.health;
        if (!data || !data[index]) return;
        const p = data[index];
        const lat = p.lat || p.latitude;
        const lng = p.lng || p.longitude;
        if (!lat || !lng) return;
        map.setView([lat, lng], 16);
        const layerGroup = activeLayers[tab]?.markers;
        if (layerGroup) {
            layerGroup.eachLayer((layer) => {
                if (layer._latlng && layer._latlng.lat === lat && layer._latlng.lng === lng) {
                    layer.openPopup();
                }
            });
        }
        const items = document.querySelectorAll('#default-list .property-item, #property-list .property-item');
        items.forEach((el, i) => el.classList.toggle('active', i === index));
    }

    // ============================================================
    // FILTER
    // ============================================================
    function filterList() {
        const query = searchInput.value.toLowerCase().trim();
        if (currentTab === 'land') {
            const data = allData.land || [];
            if (!query) { renderLandList(data); return; }
            const filtered = data.filter(p => {
                const title = (p.title || '').toLowerCase();
                const loc = (p.location || '').toLowerCase();
                return title.includes(query) || loc.includes(query);
            });
            renderLandList(filtered);
        } else if (currentTab === 'health') {
            applyHealthFilter();
        }
    }

    // ============================================================
    // HEALTH DASHBOARD
    // ============================================================
    function buildHealthDashboard(facilities) {
        if (!facilities || facilities.length === 0) {
            document.getElementById('healthStats').innerHTML = '<div class="stat-card"><div class="number">0</div><div class="label">No data</div></div>';
            return;
        }

        const total = facilities.length;
        const counts = { public: 0, private: 0, faith: 0, unknown: 0 };
        const typeCounts = {};
        facilities.forEach(f => {
            const cat = getOwnershipCategory(f.operator);
            counts[cat] = (counts[cat] || 0) + 1;
            const type = f.facility_type || 'Unknown';
            typeCounts[type] = (typeCounts[type] || 0) + 1;
        });

        const statsHtml = `
            <div class="stat-card public"><div class="number">${counts.public}</div><div class="label">Public</div><div class="sub">${(counts.public/total*100).toFixed(1)}%</div></div>
            <div class="stat-card private"><div class="number">${counts.private}</div><div class="label">Private</div><div class="sub">${(counts.private/total*100).toFixed(1)}%</div></div>
            <div class="stat-card faith"><div class="number">${counts.faith}</div><div class="label">Faith / NGO</div><div class="sub">${(counts.faith/total*100).toFixed(1)}%</div></div>
            <div class="stat-card unknown"><div class="number">${counts.unknown}</div><div class="label">Unknown</div><div class="sub">${(counts.unknown/total*100).toFixed(1)}%</div></div>
        `;
        document.getElementById('healthStats').innerHTML = statsHtml;

        // Pie chart
        const pieData = {
            labels: ['Public', 'Private', 'Faith / NGO', 'Unknown'],
            datasets: [{
                data: [counts.public, counts.private, counts.faith, counts.unknown],
                backgroundColor: ['#2563eb', '#f97316', '#8b5cf6', '#94a3b8'],
                borderWidth: 1
            }]
        };
        if (pieChart) pieChart.destroy();
        const pieCtx = document.getElementById('pieChart').getContext('2d');
        pieChart = new Chart(pieCtx, {
            type: 'pie',
            data: pieData,
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false }, tooltip: { callbacks: { label: function(context) {
                    const total = context.dataset.data.reduce((a,b) => a+b, 0);
                    return context.label + ': ' + context.parsed + ' (' + ((context.parsed/total)*100).toFixed(1) + '%)';
                } } } },
                onClick: function(e, elements) {
                    if (elements.length > 0) {
                        const index = elements[0].index;
                        const labels = ['public', 'private', 'faith', 'unknown'];
                        healthFilter = labels[index];
                        applyHealthFilter();
                        updateFilterButtons();
                    }
                }
            }
        });

        // Bar chart
        const sortedTypes = Object.keys(typeCounts).sort((a,b) => typeCounts[b] - typeCounts[a]);
        const typeLabels = sortedTypes.slice(0, 8);
        const typeData = typeLabels.map(t => typeCounts[t]);
        if (barChart) barChart.destroy();
        const barCtx = document.getElementById('barChart').getContext('2d');
        barChart = new Chart(barCtx, {
            type: 'bar',
            data: {
                labels: typeLabels,
                datasets: [{
                    label: 'Facilities',
                    data: typeData,
                    backgroundColor: '#3b82f6',
                    borderColor: '#2563eb',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, ticks: { font: { size: 8 } } },
                    x: { ticks: { font: { size: 8 }, maxRotation: 45, minRotation: 30 } }
                },
                onClick: function(e, elements) {
                    if (elements.length > 0) {
                        const index = elements[0].index;
                        healthFilter = typeLabels[index];
                        applyHealthFilter();
                        updateFilterButtons();
                    }
                }
            }
        });

        healthMarkers = facilities;
        applyHealthFilter();
    }

    function updateFilterButtons() {
        const filterBar = document.getElementById('healthFilterBar');
        filterBar.querySelectorAll('button:not(.reset-btn)').forEach(btn => {
            const cat = btn.dataset.cat;
            btn.classList.toggle('active', healthFilter === cat);
        });
    }

    function applyHealthFilter() {
        let data = healthMarkers;
        let filterLabel = 'All';

        if (healthFilter) {
            const categories = ['public', 'private', 'faith', 'unknown'];
            if (categories.includes(healthFilter)) {
                data = data.filter(f => getOwnershipCategory(f.operator) === healthFilter);
                filterLabel = getCategoryLabel(healthFilter);
            } else {
                data = data.filter(f => (f.facility_type || 'Unknown') === healthFilter);
                filterLabel = healthFilter;
            }
        }

        const query = searchInput.value.toLowerCase().trim();
        if (query) {
            data = data.filter(f => {
                const name = (f.name || '').toLowerCase();
                const ward = (f.ward || '').toLowerCase();
                return name.includes(query) || ward.includes(query);
            });
        }

        updateHealthMarkers(data);
        renderHealthList(data);
        const total = healthMarkers.length;
        if (countBadge) countBadge.textContent = data.length + ' facilities' + (healthFilter ? ' (' + filterLabel + ')' : '');
    }

    function resetHealthFilter() {
        healthFilter = null;
        searchInput.value = '';
        applyHealthFilter();
        updateFilterButtons();
    }

    // ============================================================
    // MARKER HELPERS
    // ============================================================
    function getOwnershipCategory(operator) {
        if (!operator) return 'unknown';
        const op = operator.toLowerCase();
        if (op.includes('ministry of health') || op.includes('government') || op.includes('local authority') || op.includes('armed forces') || op.includes('public')) return 'public';
        if (op.includes('private practice') || op.includes('private enterprise') || op.includes('company medical') || op.includes('for profit')) return 'private';
        if (op.includes('faith') || op.includes('church') || op.includes('catholic') || op.includes('pcea') || op.includes('aic') || op.includes('ngo')) return 'faith';
        return 'unknown';
    }

    function getMarkerColor(operator) {
        const cat = getOwnershipCategory(operator);
        const colors = { 'public': '#2563eb', 'private': '#f97316', 'faith': '#8b5cf6', 'unknown': '#94a3b8' };
        return colors[cat] || '#94a3b8';
    }

    function getCategoryLabel(cat) {
        const labels = { 'public': 'Public', 'private': 'Private', 'faith': 'Faith / NGO', 'unknown': 'Unknown' };
        return labels[cat] || 'Unknown';
    }

    // ============================================================
    // UPDATE HEALTH MARKERS (with hospital pins)
    // ============================================================
    function updateHealthMarkers(facilities) {
        if (activeLayers.health.markers) map.removeLayer(activeLayers.health.markers);
        activeLayers.health.markers = L.layerGroup();
        facilities.forEach(f => {
            const lat = f.latitude;
            const lng = f.longitude;
            if (lat && lng) {
                const color = getMarkerColor(f.operator);
                const popup = buildHealthPopup(f);
                const hospitalIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2C8.13 2 5 5.13 5 9C5 14.25 12 22 12 22C12 22 19 14.25 19 9C19 5.13 15.87 2 12 2Z" fill="${color}"/>
                            <circle cx="12" cy="9" r="4" fill="white"/>
                            <path d="M12 7V11M10 9H14" stroke="${color}" stroke-width="2" stroke-linecap="round"/>
                         </svg>`,
                    iconSize: [40, 40],
                    iconAnchor: [20, 40],
                    popupAnchor: [0, -40]
                });
                const marker = L.marker([lat, lng], { icon: hospitalIcon }).bindPopup(popup);
                marker._lat = lat;
                marker._lng = lng;
                marker._targetType = 'health_facility';
                marker._targetId = f.id;
                activeLayers.health.markers.addLayer(marker);
            }
        });
        if (currentTab === 'health') activeLayers.health.markers.addTo(map);

        // Health legend
        if (currentTab === 'health') {
            const legendHtml = `
                <div class="legend">
                    <div class="title">Ownership</div>
                    <div class="legend-item"><span style="display:inline-block;width:12px;height:12px;background:#2563eb;border-radius:50%;"></span> Public</div>
                    <div class="legend-item"><span style="display:inline-block;width:12px;height:12px;background:#f97316;border-radius:50%;"></span> Private</div>
                    <div class="legend-item"><span style="display:inline-block;width:12px;height:12px;background:#8b5cf6;border-radius:50%;"></span> Faith / NGO</div>
                    <div class="legend-item"><span style="display:inline-block;width:12px;height:12px;background:#94a3b8;border-radius:50%;"></span> Unknown</div>
                </div>
            `;
            legendContainer.innerHTML = legendHtml;
            legendContainer.style.display = 'block';
        }
    }

    // ============================================================
    // UPDATE LAND MARKERS
    // ============================================================
    function updateLandMarkers(markerData) {
        if (activeLayers.land.markers) map.removeLayer(activeLayers.land.markers);
        activeLayers.land.markers = L.layerGroup();
        markerData.forEach(m => {
            const popupContent = buildLandPopup(m);
            const circle = L.circleMarker([m.lat, m.lng], {
                radius: 5,
                color: '#2563eb',
                fillColor: '#2563eb',
                fillOpacity: 0.4,
                weight: 1.5
            }).bindPopup(popupContent);
            circle._targetType = 'listing';
            circle._targetId = m.id || m.listing_id || 0;
            activeLayers.land.markers.addLayer(circle);
        });
        if (currentTab === 'land') activeLayers.land.markers.addTo(map);
    }

    // ============================================================
    // LOAD BOUNDARIES – with fillOpacity: 0
    // ============================================================
    async function loadBoundaries() {
        try {
            const subRes = await fetch('/nakuru_subcounties.geojson');
            if (!subRes.ok) {
                console.warn('Sub-county GeoJSON not found (404)');
                return;
            }
            const subData = await subRes.json();
            console.log('Sub-county features:', subData.features.length);
            if (activeLayers.land.subcounty) map.removeLayer(activeLayers.land.subcounty);

            const statType = currentStat;
            const values = Object.values(subCountyStats).map(s => s[statType] || 0);
            const maxVal = Math.max(...values, 1);
            const minVal = Math.min(...values, 0);
            const colorScale = chroma.scale(['#e0f2fe', '#0284c7', '#f97316', '#dc2626']).domain([minVal, maxVal]);

            const style = (feature) => {
                const name = feature.properties?.NAME || feature.properties?.name || feature.properties?.SubCounty || '';
                const stat = subCountyStats[name];
                let val = 0;
                if (stat) val = stat[statType] || 0;
                return {
                    fillColor: val > 0 ? colorScale(val).hex() : '#f1f5f9',
                    fillOpacity: 0,
                    weight: 2,
                    color: '#0f172a',
                    opacity: 0.8
                };
            };

            const onEachFeature = (feature, layer) => {
                const name = feature.properties?.NAME || feature.properties?.name || feature.properties?.SubCounty || 'Unknown';
                const stat = subCountyStats[name];
                if (!stat) return;
                layer.bindPopup(`
                    <div style="font-family: sans-serif; min-width: 180px;">
                        <strong>${name}</strong><br/>
                        <span style="color: #555;">
                            Median: KSh ${Math.round(stat.median).toLocaleString()}/ha<br/>
                            Avg: KSh ${Math.round(stat.avg).toLocaleString()}/ha<br/>
                            Min: KSh ${Math.round(stat.min).toLocaleString()}/ha<br/>
                            Max: KSh ${Math.round(stat.max).toLocaleString()}/ha<br/>
                            Listings: ${stat.count}
                        </span>
                    </div>
                `);
            };

            activeLayers.land.subcounty = L.geoJSON(subData, { style, onEachFeature });
            activeLayers.land.subcounty.setZIndex(0);
            if (currentTab === 'land') activeLayers.land.subcounty.addTo(map);

            const legendTitle = {
                'median': 'Median Price/ha',
                'avg': 'Avg Price/ha',
                'min': 'Min Price/ha',
                'max': 'Max Price/ha',
                'range': 'Price Range (Max-Min)',
                'count': 'Number of Listings'
            }[statType] || 'Value';

            const legendHtml = `
                <div class="legend">
                    <div class="title">${legendTitle}</div>
                    <div class="gradient" style="background: linear-gradient(to right, ${colorScale(minVal).hex()}, ${colorScale(maxVal).hex()});"></div>
                    <div class="labels">
                        <span>KSh ${Math.round(minVal).toLocaleString()}</span>
                        <span>KSh ${Math.round(maxVal).toLocaleString()}</span>
                    </div>
                </div>
            `;
            legendContainer.innerHTML = legendHtml;
            legendContainer.style.display = 'block';

            // Wards
            const wardRes = await fetch('/nakuru_wards.geojson');
            if (!wardRes.ok) {
                console.warn('Ward GeoJSON not found (404)');
            } else {
                const wardData = await wardRes.json();
                console.log('Ward features:', wardData.features.length);
                if (activeLayers.land.wards) map.removeLayer(activeLayers.land.wards);
                activeLayers.land.wards = L.geoJSON(wardData, {
                    style: { fill: false, weight: 2, color: '#4a5568', opacity: 0.8, dashArray: null },
                    onEachFeature: (feature, layer) => {
                        const name = feature.properties?.NAME || feature.properties?.name || 'Ward';
                        layer.bindPopup('<strong>' + name + '</strong><br/>Ward boundary');
                        layer.bindTooltip(name, { permanent: false, direction: 'center' });
                    }
                });
                activeLayers.land.wards.setZIndex(1000);
                activeLayers.land.wards.bringToFront();
                if (currentTab === 'land') activeLayers.land.wards.addTo(map);
                const bounds = activeLayers.land.wards.getBounds();
                if (bounds.isValid()) map.fitBounds(bounds, { padding: [50, 50] });
            }

            const overlayControl = {
                "Sub-counties (price)": activeLayers.land.subcounty,
                "Wards (outlines)": activeLayers.land.wards
            };
            if (window._layerControl) map.removeControl(window._layerControl);
            window._layerControl = L.control.layers(null, overlayControl, { collapsed: false }).addTo(map);
            console.log('✅ Choropleth + wards loaded');
        } catch (err) {
            console.error('Error loading boundaries:', err);
        }
    }

    // ============================================================
    // SWITCH TAB – with layer safety check
    // ============================================================
    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === tab));

        if (tab === 'health') {
            healthDashboard.style.display = 'flex';
            defaultList.style.display = 'none';
            if (healthMarkers.length > 0) { applyHealthFilter(); }
            else { loadHealthData(); }
        } else {
            healthDashboard.style.display = 'none';
            defaultList.style.display = 'block';
            if (tab === 'land') { loadBoundaries(); }
            else { legendContainer.style.display = 'none'; }
        }

        // Remove all layers except base – with safety check
        for (const key in activeLayers) {
            for (const layerKey in activeLayers[key]) {
                const layer = activeLayers[key][layerKey];
                if (layer && typeof layer === 'object' && map.hasLayer(layer)) {
                    map.removeLayer(layer);
                }
            }
        }

        const layers = activeLayers[tab];
        for (const layerKey in layers) {
            const layer = layers[layerKey];
            if (layer && typeof layer === 'object' && !map.hasLayer(layer)) {
                layer.addTo(map);
            }
        }
        // Also add user contributions if they exist (star markers)
        if (activeLayers.userContributions && typeof activeLayers.userContributions === 'object') {
            if (!map.hasLayer(activeLayers.userContributions)) {
                activeLayers.userContributions.addTo(map);
            }
        }

        if (tab === 'land') {
            const data = allData.land || [];
            renderLandList(data);
        } else if (tab === 'health') {
            // already handled above
        } else {
            const data = allData[tab] || [];
            renderGenericList(data, tab);
        }
        searchInput.value = '';
        if (!allData[tab] || allData[tab].length === 0) refreshMap();
    }

    function renderGenericList(data, tab) {
        let html = '';
        if (!data || data.length === 0) {
            html = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px;">No data found.</div>';
        } else {
            data.forEach((p, index) => {
                const title = p.name || 'Untitled';
                const loc = p.location || 'Nakuru';
                html += `
                    <div class="property-item" data-index="${index}" onclick="zoomToProperty(${index}, '${tab}')">
                        <div class="info"><div class="title">${title}</div><div class="meta"><span>${loc}</span></div></div>
                        <div class="price">—</div>
                    </div>
                `;
            });
        }
        defaultList.innerHTML = html;
        if (countBadge) countBadge.textContent = data.length + ' records';
    }

    // ============================================================
    // LOAD HEALTH DATA
    // ============================================================
    async function loadHealthData() {
        try {
            const { data, error } = await supabaseClient
                .from('health_facilities')
                .select('*')
                .not('latitude', 'is', null)
                .limit(1000);
            if (error) throw error;

            const { data: userHealth, error: userErr } = await supabaseClient
                .from('user_contributions')
                .select('*')
                .eq('type', 'health');
            if (userErr) console.warn('Error loading user health contributions:', userErr);

            let combined = data || [];
            if (userHealth) {
                userHealth.forEach(c => {
                    const coords = getCoordsFromGeometry(c.geometry);
                    if (coords) {
                        const props = c.properties;
                        combined.push({
                            name: props.name || 'User contribution',
                            facility_type: props.facility_type || 'Unknown',
                            operator: props.operator || 'User',
                            ward: props.ward || 'Nakuru',
                            sub_county: props.sub_county || 'Nakuru',
                            town: props.town || null,
                            bed_capacity: props.bed_capacity || null,
                            description: props.description || '',
                            location: props.location || 'Nakuru',
                            latitude: coords.lat,
                            longitude: coords.lng,
                            id: c.id,
                            isUserContribution: true,
                            source: 'user_contribution'
                        });
                    }
                });
            }

            allData.health = combined;
            healthMarkers = combined;
            buildHealthDashboard(combined);
            healthDashboard.style.display = 'flex';
            defaultList.style.display = 'none';
        } catch (err) {
            console.error('Error loading health data:', err);
            showToast('Error loading health data', 'error');
        }
    }

    // ============================================================
    // REFRESH ALL DATA – with heatmap red→green and translucent
    // ============================================================
    async function refreshMap() {
        if (isRunning) return;
        isRunning = true;
        setStatus('running', 'Refreshing…');
        showToast('Refreshing data…', 'info');
        refreshBtn.disabled = true;
        refreshBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

        try {
            const tab = currentTab;
            if (tab === 'land') {
                const rawData = await loadTabData('listings');
                const { data: userLand, error: userErr } = await supabaseClient
                    .from('user_contributions')
                    .select('*')
                    .eq('type', 'land');
                if (userErr) console.warn('Error loading user land contributions:', userErr);

                let markerData = [];
                const stats = {};

                rawData.forEach(item => {
                    const size = getSize(item);
                    if (!item.price || !size || size <= 0) return;
                    const pricePerHa = item.price / size;
                    const key = item.location ? item.location.replace(/ County$/i, '').trim() : 'Nakuru';
                    if (!stats[key]) stats[key] = { prices: [], count: 0 };
                    stats[key].prices.push(pricePerHa);
                    stats[key].count += 1;
                    if (item.latitude && item.longitude) {
                        markerData.push({
                            lat: item.latitude,
                            lng: item.longitude,
                            title: item.title || 'Plot',
                            price: item.price,
                            size_ha: size,
                            location: item.location || 'Nakuru',
                            source: item.source || '',
                            pricePerHa: pricePerHa,
                            id: item.id || 0,
                            isUserContribution: false
                        });
                    }
                });

                if (userLand) {
                    userLand.forEach(c => {
                        const coords = getCoordsFromGeometry(c.geometry);
                        if (coords) {
                            const props = c.properties;
                            const size = props.size_ha || 0;
                            const price = props.price || 0;
                            const pricePerHa = size > 0 ? price / size : 0;
                            markerData.push({
                                lat: coords.lat,
                                lng: coords.lng,
                                title: props.title || 'User contribution',
                                price: price,
                                size_ha: size,
                                location: props.location || 'Nakuru',
                                description: props.description || '',
                                source: 'user_contribution',
                                pricePerHa: pricePerHa,
                                id: c.id,
                                isUserContribution: true
                            });
                            const key = props.location ? props.location.replace(/ County$/i, '').trim() : 'Nakuru';
                            if (!stats[key]) stats[key] = { prices: [], count: 0 };
                            if (price && size > 0) {
                                stats[key].prices.push(pricePerHa);
                                stats[key].count += 1;
                            }
                        }
                    });
                }

                const computed = {};
                Object.keys(stats).forEach(key => {
                    const s = stats[key];
                    const prices = s.prices;
                    const count = s.count;
                    let avg = 0, min = 0, max = 0, range = 0, med = 0;
                    if (prices.length > 0) {
                        avg = prices.reduce((a,b) => a+b,0) / prices.length;
                        min = Math.min(...prices);
                        max = Math.max(...prices);
                        range = max - min;
                        med = median(prices);
                    }
                    computed[key] = { count, avg, min, max, range, median: med };
                });
                subCountyStats = computed;
                console.log('Sub-county stats (price/ha):', computed);

                // ---- Heatmap ----
                let pricesPerHa = [];
                markerData.forEach(m => {
                    if (m.pricePerHa && m.pricePerHa > 0) pricesPerHa.push(m.pricePerHa);
                });
                pricesPerHa.sort((a,b) => a - b);
                const percentile95 = pricesPerHa[Math.floor(pricesPerHa.length * 0.95)] || 1;
                const maxIntensity = percentile95;

                const points = [];
                markerData.forEach(m => {
                    if (m.lat && m.lng && m.pricePerHa && m.pricePerHa > 0 && !m.isUserContribution) {
                        const intensity = Math.min(m.pricePerHa / maxIntensity, 1);
                        points.push([m.lat, m.lng, intensity]);
                    }
                });

                console.log('Heatmap points (price/ha):', points.length);

                if (activeLayers.land.heat) map.removeLayer(activeLayers.land.heat);
                if (activeLayers.land.markers) map.removeLayer(activeLayers.land.markers);

                if (points.length > 0) {
                    activeLayers.land.heat = L.heatLayer(points, {
                        radius: 50,
                        blur: 30,
                        maxZoom: 15,
                        gradient: {
                            0.0: 'rgba(255,0,0,0.35)',
                            0.33: 'rgba(255,165,0,0.35)',
                            0.66: 'rgba(255,255,0,0.35)',
                            1.0: 'rgba(0,255,0,0.35)'
                        }
                    });
                    activeLayers.land.heat.addTo(map);
                }

                updateLandMarkers(markerData);
                allData.land = markerData;
                await loadBoundaries();

                if (points.length > 0) {
                    const bounds = L.latLngBounds(points.map(p => [p[0], p[1]]));
                    map.fitBounds(bounds, { padding: [50, 50] });
                }
                renderLandList(markerData);
                showToast('Loaded ' + markerData.length + ' items', 'success');

            } else if (tab === 'health') {
                await loadHealthData();
                showToast('Loaded health facilities', 'success');
            } else {
                const tableName = tab === 'schools' ? 'schools' : 'water_sources';
                const { data, error } = await supabaseClient.from(tableName).select('*').not('latitude', 'is', null).limit(1000);
                if (error) throw error;
                allData[tab] = data || [];
                const groupName = tab;
                if (activeLayers[groupName].markers) map.removeLayer(activeLayers[groupName].markers);
                activeLayers[groupName].markers = L.layerGroup();
                (data || []).forEach(item => {
                    if (item.latitude && item.longitude) {
                        const marker = L.circleMarker([item.latitude, item.longitude], { radius: 5, color: '#2ecc71', fillColor: '#2ecc71', fillOpacity: 0.5 })
                            .bindPopup(`<b>${item.name || 'Untitled'}</b><br/>${item.location || ''}`);
                        activeLayers[groupName].markers.addLayer(marker);
                    }
                });
                allData[tab] = (data || []).map(item => ({ ...item, lat: item.latitude, lng: item.longitude }));
                renderGenericList(allData[tab], tab);
                showToast('Loaded ' + (data || []).length + ' records', 'success');
            }

            await loadUserContributions();
            switchTab(currentTab);

        } catch (err) {
            console.error(err);
            showToast('Error loading data', 'error');
        }

        isRunning = false;
        setStatus('idle', 'Idle');
        refreshBtn.disabled = false;
        refreshBtn.innerHTML = '<i class="fas fa-sync-alt"></i>';
    }

    async function loadTabData(tableName) {
        try {
            const { data, error } = await supabaseClient.from(tableName).select('*').not('latitude', 'is', null).limit(1000);
            if (error) throw error;
            return data || [];
        } catch (err) {
            console.warn(`Error loading ${tableName}:`, err);
            return [];
        }
    }

    // ============================================================
    // USER CONTRIBUTIONS
    // ============================================================
    async function loadUserContributions() {
        if (activeLayers.userContributions) {
            map.removeLayer(activeLayers.userContributions);
            activeLayers.userContributions = null;
        }
        const { data: contributions, error } = await supabaseClient
            .from('user_contributions')
            .select('*');
        if (error) {
            console.warn('Error loading user contributions:', error);
            return;
        }
        if (!contributions || contributions.length === 0) return;

        const group = L.layerGroup();
        contributions.forEach(c => {
            const coords = getCoordsFromGeometry(c.geometry);
            if (!coords) return;
            const props = c.properties;
            const popupContent = `
                <b>${props.title || props.name || 'User contribution'}</b><br/>
                ${props.price ? `Price: KSh ${(props.price || 0).toLocaleString()}<br/>` : ''}
                ${props.size_ha ? `Size: ${(props.size_ha || 0).toFixed(2)} Ha<br/>` : ''}
                Location: ${props.location || 'Nakuru'}<br/>
                ${props.description ? `Description: ${props.description}<br/>` : ''}
                ${props.facility_type ? `Type: ${props.facility_type}<br/>` : ''}
                ${props.operator ? `Operator: ${props.operator}<br/>` : ''}
                ${props.ward ? `Ward: ${props.ward}<br/>` : ''}
                ${props.sub_county ? `Sub-County: ${props.sub_county}<br/>` : ''}
                <em style="color:var(--text-muted);font-size:11px;">Added by user</em>
                <hr style="margin:4px 0;border-color:var(--border);"/>
                <div id="comments_user_${c.id}">Loading comments...</div>
            `;
            const starIcon = L.divIcon({
                className: 'custom-div-icon',
                html: `<svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.27 5.82 22 7 14.14 2 9.27l6.91-1.01L12 2z" fill="gold" stroke="orange" stroke-width="1"/></svg>`,
                iconSize: [30, 30],
                iconAnchor: [15, 30]
            });
            const marker = L.marker([coords.lat, coords.lng], { icon: starIcon })
                .bindPopup(popupContent);
            marker._targetType = 'user_contribution';
            marker._targetId = c.id;
            group.addLayer(marker);
        });
        activeLayers.userContributions = group;
        activeLayers.userContributions.addTo(map);
    }

    // ============================================================
    // UPDATE CHOROPLETH
    // ============================================================
    function updateChoropleth() {
        const newStat = document.getElementById('statSelect')?.value;
        if (newStat && newStat !== currentStat) {
            currentStat = newStat;
            if (currentTab === 'land') loadBoundaries();
        }
    }

    // ============================================================
    // EXPORT FUNCTIONS
    // ============================================================
    function exportPNG() {
        leafletImage(map, function(err, canvas) {
            if (err) { showToast('Error exporting PNG', 'error'); return; }
            const link = document.createElement('a');
            link.download = currentTab + '_map.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }

    function exportPDF() {
        const element = document.querySelector('#sidebar');
        html2canvas(element, { scale: 2 }).then(canvas => {
            const imgData = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('landscape', 'mm', 'a4');
            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = pdf.internal.pageSize.getHeight();
            pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
            pdf.save(currentTab + '_dashboard.pdf');
        }).catch(err => showToast('Error generating PDF', 'error'));
    }

    function exportCSV() {
        const data = allData[currentTab] || [];
        if (data.length === 0) { showToast('No data to export', 'info'); return; }
        const headers = Object.keys(data[0]);
        let csv = headers.join(',') + '\n';
        data.forEach(row => {
            const values = headers.map(h => {
                let val = row[h] || '';
                if (typeof val === 'string' && (val.includes(',') || val.includes('"'))) {
                    val = '"' + val.replace(/"/g, '""') + '"';
                }
                return val;
            });
            csv += values.join(',') + '\n';
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const link = document.createElement('a');
        link.download = currentTab + '_data.csv';
        link.href = URL.createObjectURL(blob);
        link.click();
    }

    function exportGeoJSON() {
        const data = allData[currentTab] || [];
        if (data.length === 0) { showToast('No data to export', 'info'); return; }
        const features = data.map(item => {
            const lat = item.lat || item.latitude;
            const lng = item.lng || item.longitude;
            if (!lat || !lng) return null;
            return {
                type: 'Feature',
                geometry: { type: 'Point', coordinates: [lng, lat] },
                properties: { ...item }
            };
        }).filter(f => f !== null);
        const geojson = { type: 'FeatureCollection', features };
        const blob = new Blob([JSON.stringify(geojson, null, 2)], { type: 'application/json' });
        const link = document.createElement('a');
        link.download = currentTab + '_data.geojson';
        link.href = URL.createObjectURL(blob);
        link.click();
    }

    // ============================================================
    // INIT
    // ============================================================
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });
    searchInput.addEventListener('input', filterList);
    refreshMap();
    setInterval(() => { if (!isRunning) refreshMap(); }, 300000);
</script>
</body>
</html>
