    // ============================================================
    // LOAD BOUNDARIES
    // ============================================================
    async function loadBoundaries() {
        try {
            const subRes = await fetch('/nakuru_subcounties.geojson');
            if (!subRes.ok) {
                console.warn('Sub-county GeoJSON not found (404)');
                return;
            }
            const subData = await subRes.json();
            console.log('Sub-county features:', subData.features.length);
            if (activeLayers.land.subcounty) map.removeLayer(activeLayers.land.subcounty);

            const statType = currentStat;
            const values = Object.values(subCountyStats).map(s => s[statType] || 0);
            const maxVal = Math.max(...values, 1);
            const minVal = Math.min(...values, 0);
            const colorScale = chroma.scale(['#e0f2fe', '#0284c7', '#f97316', '#dc2626']).domain([minVal, maxVal]);

            const style = (feature) => {
                const name = feature.properties?.NAME || feature.properties?.name || feature.properties?.SubCounty || '';
                const stat = subCountyStats[name];
                let val = 0;
                if (stat) val = stat[statType] || 0;
                return {
                    fillColor: val > 0 ? colorScale(val).hex() : '#f1f5f9',
                    fillOpacity: 0,
                    weight: 2,
                    color: '#0f172a',
                    opacity: 0.8
                };
            };

            const onEachFeature = (feature, layer) => {
                const name = feature.properties?.NAME || feature.properties?.name || feature.properties?.SubCounty || 'Unknown';
                const stat = subCountyStats[name];
                if (!stat) return;
                layer.bindPopup(`
                    <div style="font-family: sans-serif; min-width: 180px;">
                        <strong>${name}</strong><br/>
                        <span style="color: #555;">
                            Median: KSh ${Math.round(stat.median).toLocaleString()}/ha<br/>
                            Avg: KSh ${Math.round(stat.avg).toLocaleString()}/ha<br/>
                            Min: KSh ${Math.round(stat.min).toLocaleString()}/ha<br/>
                            Max: KSh ${Math.round(stat.max).toLocaleString()}/ha<br/>
                            Listings: ${stat.count}
                        </span>
                    </div>
                `);
            };

            activeLayers.land.subcounty = L.geoJSON(subData, { style, onEachFeature });
            activeLayers.land.subcounty.setZIndex(0);
            if (currentTab === 'land') activeLayers.land.subcounty.addTo(map);

            const legendTitle = {
                'median': 'Median Price/ha',
                'avg': 'Avg Price/ha',
                'min': 'Min Price/ha',
                'max': 'Max Price/ha',
                'range': 'Price Range (Max-Min)',
                'count': 'Number of Listings'
            }[statType] || 'Value';

            const legendHtml = `
                <div class="legend">
                    <div class="title">${legendTitle}</div>
                    <div class="gradient" style="background: linear-gradient(to right, ${colorScale(minVal).hex()}, ${colorScale(maxVal).hex()});"></div>
                    <div class="labels">
                        <span>KSh ${Math.round(minVal).toLocaleString()}</span>
                        <span>KSh ${Math.round(maxVal).toLocaleString()}</span>
                    </div>
                </div>
            `;
            legendContainer.innerHTML = legendHtml;
            legendContainer.style.display = 'block';

            // Wards
            const wardRes = await fetch('/nakuru_wards.geojson');
            if (!wardRes.ok) {
                console.warn('Ward GeoJSON not found (404)');
            } else {
                const wardData = await wardRes.json();
                console.log('Ward features:', wardData.features.length);
                if (activeLayers.land.wards) map.removeLayer(activeLayers.land.wards);
                activeLayers.land.wards = L.geoJSON(wardData, {
                    style: { fill: false, weight: 2, color: '#4a5568', opacity: 0.8, dashArray: null },
                    onEachFeature: (feature, layer) => {
                        const name = feature.properties?.NAME || feature.properties?.name || 'Ward';
                        layer.bindPopup('<strong>' + name + '</strong><br/>Ward boundary');
                        layer.bindTooltip(name, { permanent: false, direction: 'center' });
                    }
                });
                activeLayers.land.wards.setZIndex(1000);
                activeLayers.land.wards.bringToFront();
                if (currentTab === 'land') activeLayers.land.wards.addTo(map);
                const bounds = activeLayers.land.wards.getBounds();
                if (bounds.isValid()) map.fitBounds(bounds, { padding: [50, 50] });
            }

            const overlayControl = {
                "Sub-counties (price)": activeLayers.land.subcounty,
                "Wards (outlines)": activeLayers.land.wards
            };
            if (window._layerControl) map.removeControl(window._layerControl);
            window._layerControl = L.control.layers(null, overlayControl, { collapsed: false }).addTo(map);
            console.log('✅ Choropleth + wards loaded');
        } catch (err) {
            console.error('Error loading boundaries:', err);
        }
    }

    // ============================================================
    // SWITCH TAB
    // ============================================================
    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === tab));

        // Show/hide panels
        const analytics = document.getElementById('land-analytics');
        const landFilters = document.getElementById('land-filters');
        const healthFilters = document.getElementById('health-filters');
        const predictor = document.getElementById('price-predictor');

        if (tab === 'land') {
            analytics.style.display = 'block';
            if (filtersVisible) landFilters.style.display = 'flex'; else landFilters.style.display = 'none';
            healthFilters.style.display = 'none';
            if (predictorVisible) predictor.style.display = 'flex'; else predictor.style.display = 'none';
            if (allData.land && subCountyStats) {
                buildLandAnalytics(allData.land, subCountyStats);
                populateLandFilterDropdowns();
            }
            healthDashboard.style.display = 'none';
            defaultList.style.display = 'block';
            loadBoundaries();
        } else if (tab === 'health') {
            analytics.style.display = 'none';
            landFilters.style.display = 'none';
            if (filtersVisible) healthFilters.style.display = 'flex'; else healthFilters.style.display = 'none';
            predictor.style.display = 'none';
            healthDashboard.style.display = 'flex';
            defaultList.style.display = 'none';
            if (healthMarkers.length > 0) { applyHealthFilter(); }
            else { loadHealthData(); }
            // Populate health filter dropdowns
            if (allData.health) populateHealthFilterDropdowns();
        } else {
            analytics.style.display = 'none';
            landFilters.style.display = 'none';
            healthFilters.style.display = 'none';
            predictor.style.display = 'none';
            healthDashboard.style.display = 'none';
            defaultList.style.display = 'block';
            legendContainer.style.display = 'none';
        }

        // Remove all layers except base – with safety check
        for (const key in activeLayers) {
            for (const layerKey in activeLayers[key]) {
                const layer = activeLayers[key][layerKey];
                if (layer && typeof layer === 'object' && map.hasLayer(layer)) {
                    map.removeLayer(layer);
                }
            }
        }

        const layers = activeLayers[tab];
        for (const layerKey in layers) {
            const layer = layers[layerKey];
            if (layer && typeof layer === 'object' && !map.hasLayer(layer)) {
                layer.addTo(map);
            }
        }
        if (activeLayers.userContributions && typeof activeLayers.userContributions === 'object') {
            if (!map.hasLayer(activeLayers.userContributions)) {
                activeLayers.userContributions.addTo(map);
            }
        }

        if (tab === 'land') {
            const data = allData.land || [];
            renderLandList(data);
        } else if (tab === 'health') {
            // already handled
        } else {
            const data = allData[tab] || [];
            renderGenericList(data, tab);
        }
        searchInput.value = '';
        if (!allData[tab] || allData[tab].length === 0) refreshMap();
    }

    function renderGenericList(data, tab) {
        let html = '';
        if (!data || data.length === 0) {
            html = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px;">No data found.</div>';
        } else {
            data.forEach((p, index) => {
                const title = p.name || 'Untitled';
                const loc = p.location || 'Nakuru';
                html += `
                    <div class="property-item" data-index="${index}" onclick="zoomToProperty(${index}, '${tab}')">
                        <div class="info"><div class="title">${title}</div><div class="meta"><span>${loc}</span></div></div>
                        <div class="price">—</div>
                    </div>
                `;
            });
        }
        defaultList.innerHTML = html;
        if (countBadge) countBadge.textContent = data.length + ' records';
    }

    // ============================================================
    // LOAD HEALTH DATA
    // ============================================================
    async function loadHealthData() {
        try {
            const { data, error } = await supabaseClient
                .from('health_facilities')
                .select('*')
                .not('latitude', 'is', null)
                .limit(1000);
            if (error) throw error;

            const { data: userHealth, error: userErr } = await supabaseClient
                .from('user_contributions')
                .select('*')
                .eq('type', 'health');
            if (userErr) console.warn('Error loading user health contributions:', userErr);

            let combined = data || [];
            if (userHealth) {
                userHealth.forEach(c => {
                    const coords = getCoordsFromGeometry(c.geometry);
                    if (coords) {
                        const props = c.properties;
                        combined.push({
                            name: props.name || 'User contribution',
                            facility_type: props.facility_type || 'Unknown',
                            operator: props.operator || 'User',
                            ward: props.ward || 'Nakuru',
                            sub_county: props.sub_county || 'Nakuru',
                            town: props.town || null,
                            bed_capacity: props.bed_capacity || null,
                            description: props.description || '',
                            location: props.location || 'Nakuru',
                            latitude: coords.lat,
                            longitude: coords.lng,
                            id: c.id,
                            isUserContribution: true,
                            source: 'user_contribution'
                        });
                    }
                });
            }

            allData.health = combined;
            healthMarkers = combined;
            buildHealthDashboard(combined);
            healthDashboard.style.display = 'flex';
            defaultList.style.display = 'none';
        } catch (err) {
            console.error('Error loading health data:', err);
            showToast('Error loading health data', 'error');
        }
    }

    // ============================================================
    // REFRESH ALL DATA
    // ============================================================
    async function refreshMap() {
        if (isRunning) return;
        isRunning = true;
        setStatus('running', 'Refreshing…');
        showToast('Refreshing data…', 'info');
        refreshBtn.disabled = true;
        refreshBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

        try {
            const tab = currentTab;
            if (tab === 'land') {
                const rawData = await loadTabData('listings');
                const { data: userLand, error: userErr } = await supabaseClient
                    .from('user_contributions')
                    .select('*')
                    .eq('type', 'land');
                if (userErr) console.warn('Error loading user land contributions:', userErr);

                let markerData = [];
                const stats = {};

                rawData.forEach(item => {
                    const size = getSize(item);
                    if (!item.price || !size || size <= 0) return;
                    const pricePerHa = item.price / size;
                    const key = item.location ? item.location.replace(/ County$/i, '').trim() : 'Nakuru';
                    if (!stats[key]) stats[key] = { prices: [], count: 0 };
                    stats[key].prices.push(pricePerHa);
                    stats[key].count += 1;
                    if (item.latitude && item.longitude) {
                        markerData.push({
                            lat: item.latitude,
                            lng: item.longitude,
                            title: item.title || 'Plot',
                            price: item.price,
                            size_ha: size,
                            location: item.location || 'Nakuru',
                            source: item.source || '',
                            pricePerHa: pricePerHa,
                            id: item.id || 0,
                            isUserContribution: false,
                            scraped_at: item.scraped_at || null
                        });
                    }
                });

                if (userLand) {
                    userLand.forEach(c => {
                        const coords = getCoordsFromGeometry(c.geometry);
                        if (coords) {
                            const props = c.properties;
                            const size = props.size_ha || 0;
                            const price = props.price || 0;
                            const pricePerHa = size > 0 ? price / size : 0;
                            markerData.push({
                                lat: coords.lat,
                                lng: coords.lng,
                                title: props.title || 'User contribution',
                                price: price,
                                size_ha: size,
                                location: props.location || 'Nakuru',
                                description: props.description || '',
                                source: 'user_contribution',
                                pricePerHa: pricePerHa,
                                id: c.id,
                                isUserContribution: true,
                                scraped_at: c.created_at || null
                            });
                            const key = props.location ? props.location.replace(/ County$/i, '').trim() : 'Nakuru';
                            if (!stats[key]) stats[key] = { prices: [], count: 0 };
                            if (price && size > 0) {
                                stats[key].prices.push(pricePerHa);
                                stats[key].count += 1;
                            }
                        }
                    });
                }

                const computed = {};
                Object.keys(stats).forEach(key => {
                    const s = stats[key];
                    const prices = s.prices;
                    const count = s.count;
                    let avg = 0, min = 0, max = 0, range = 0, med = 0;
                    if (prices.length > 0) {
                        avg = prices.reduce((a,b) => a+b,0) / prices.length;
                        min = Math.min(...prices);
                        max = Math.max(...prices);
                        range = max - min;
                        med = median(prices);
                    }
                    computed[key] = { count, avg, min, max, range, median: med };
                });
                subCountyStats = computed;
                console.log('Sub-county stats (price/ha):', computed);

                // ---- Build Heatmap (with hotspot if enabled) ----
                buildHeatmap(markerData, hotspotEnabled);

                // ---- Update land markers ----
                updateLandMarkers(markerData);
                allData.land = markerData;
                await loadBoundaries();

                // ---- Build Land Analytics Charts ----
                buildLandAnalytics(markerData, computed);

                // ---- Fit bounds ----
                const points = markerData.filter(m => m.lat && m.lng).map(m => [m.lat, m.lng]);
                if (points.length > 0) {
                    const bounds = L.latLngBounds(points);
                    map.fitBounds(bounds, { padding: [50, 50] });
                }
                renderLandList(markerData);
                showToast('Loaded ' + markerData.length + ' items', 'success');

            } else if (tab === 'health') {
                await loadHealthData();
                showToast('Loaded health facilities', 'success');
            } else {
                const tableName = tab === 'schools' ? 'schools' : 'water_sources';
                const { data, error } = await supabaseClient.from(tableName).select('*').not('latitude', 'is', null).limit(1000);
                if (error) throw error;
                allData[tab] = data || [];
                const groupName = tab;
                if (activeLayers[groupName].markers) map.removeLayer(activeLayers[groupName].markers);
                activeLayers[groupName].markers = L.layerGroup();
                (data || []).forEach(item => {
                    if (item.latitude && item.longitude) {
                        const marker = L.circleMarker([item.latitude, item.longitude], { radius: 5, color: '#2ecc71', fillColor: '#2ecc71', fillOpacity: 0.5 })
                            .bindPopup(`<b>${item.name || 'Untitled'}</b><br/>${item.location || ''}`);
                        activeLayers[groupName].markers.addLayer(marker);
                    }
                });
                allData[tab] = (data || []).map(item => ({ ...item, lat: item.latitude, lng: item.longitude }));
                renderGenericList(allData[tab], tab);
                showToast('Loaded ' + (data || []).length + ' records', 'success');
            }

            await loadUserContributions();
            switchTab(currentTab);

        } catch (err) {
            console.error(err);
            showToast('Error loading data', 'error');
        }

        isRunning = false;
        setStatus('idle', 'Idle');
        refreshBtn.disabled = false;
        refreshBtn.innerHTML = '<i class="fas fa-sync-alt"></i>';
    }

    async function loadTabData(tableName) {
        try {
            const { data, error } = await supabaseClient.from(tableName).select('*').not('latitude', 'is', null).limit(1000);
            if (error) throw error;
            return data || [];
        } catch (err) {
            console.warn(`Error loading ${tableName}:`, err);
            return [];
        }
    }

    // ============================================================
    // USER CONTRIBUTIONS
    // ============================================================
    async function loadUserContributions() {
        if (activeLayers.userContributions) {
            map.removeLayer(activeLayers.userContributions);
            activeLayers.userContributions = null;
        }
        const { data: contributions, error } = await supabaseClient
            .from('user_contributions')
            .select('*');
        if (error) {
            console.warn('Error loading user contributions:', error);
            return;
        }
        if (!contributions || contributions.length === 0) return;

        const group = L.layerGroup();
        contributions.forEach(c => {
            const coords = getCoordsFromGeometry(c.geometry);
            if (!coords) return;
            const props = c.properties;
            const popupContent = `
                <b>${props.title || props.name || 'User contribution'}</b><br/>
                ${props.price ? `Price: KSh ${(props.price || 0).toLocaleString()}<br/>` : ''}
                ${props.size_ha ? `Size: ${(props.size_ha || 0).toFixed(2)} Ha<br/>` : ''}
                Location: ${props.location || 'Nakuru'}<br/>
                ${props.description ? `Description: ${props.description}<br/>` : ''}
                ${props.facility_type ? `Type: ${props.facility_type}<br/>` : ''}
                ${props.operator ? `Operator: ${props.operator}<br/>` : ''}
                ${props.ward ? `Ward: ${props.ward}<br/>` : ''}
                ${props.sub_county ? `Sub-County: ${props.sub_county}<br/>` : ''}
                <em style="color:var(--text-muted);font-size:11px;">Added by user</em>
                <hr style="margin:4px 0;border-color:var(--border);"/>
                <div id="comments_user_${c.id}">Loading comments...</div>
            `;
            const starIcon = L.divIcon({
                className: 'custom-div-icon',
                html: `<svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.27 5.82 22 7 14.14 2 9.27l6.91-1.01L12 2z" fill="gold" stroke="orange" stroke-width="1"/></svg>`,
                iconSize: [30, 30],
                iconAnchor: [15, 30]
            });
            const marker = L.marker([coords.lat, coords.lng], { icon: starIcon })
                .bindPopup(popupContent);
            marker._targetType = 'user_contribution';
            marker._targetId = c.id;
            group.addLayer(marker);
        });
        activeLayers.userContributions = group;
        activeLayers.userContributions.addTo(map);
    }

        if (newStat && newStat !== currentStat) {

    // ============================================================
    // FILTERED DATA (for exports)
    // ============================================================
    function getFilteredData() {
        const tab = currentTab;
        if (tab === 'land') {
            const data = allData.land || [];
            const query = searchInput.value.toLowerCase().trim();
            if (!query) return data;
            return data.filter(p => {
                const title = (p.title || '').toLowerCase();
                const loc = (p.location || '').toLowerCase();
                return title.includes(query) || loc.includes(query);
            });
        } else if (tab === 'health') {
            let data = allData.health || [];
            if (healthFilter) {
                const categories = ['public', 'private', 'faith', 'unknown'];
                if (categories.includes(healthFilter)) {
                    data = data.filter(f => getOwnershipCategory(f.operator) === healthFilter);
                } else {
                    data = data.filter(f => (f.facility_type || 'Unknown') === healthFilter);
                }
            }
            const query = searchInput.value.toLowerCase().trim();
            if (query) {
                data = data.filter(f => {
                    const name = (f.name || '').toLowerCase();
                    const ward = (f.ward || '').toLowerCase();
                    return name.includes(query) || ward.includes(query);
                });
            }
            return data;
        } else {
            return allData[tab] || [];
        }
    }

    // ============================================================
    // EXPORT – FILTER-AWARE & CUSTOM COLUMNS
    // ============================================================
    function openExportModal() {
        const filteredData = getFilteredData();
        if (filteredData.length === 0) {
            showToast('No data to export', 'info');
            return;
        }
        const firstRow = filteredData[0];
        const allKeys = Object.keys(firstRow).filter(k => k !== 'lat' && k !== 'lng' && k !== '_targetType' && k !== '_targetId');
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.id = 'exportModalOverlay';
        let checkboxesHtml = allKeys.map(k => `
            <label>
                <input type="checkbox" class="export-col-checkbox" value="${k}" checked />
                ${k}
            </label>
        `).join('');
        overlay.innerHTML = `
            <div class="modal-box" style="max-width:500px;">
                <h3>Export Options</h3>
                <p style="font-size:12px;color:var(--text-muted);">Select columns to export. ${filteredData.length} rows will be exported.</p>
                <div style="display:flex;gap:6px;margin:6px 0;">
                    <button onclick="selectAllExportColumns(true)" class="export-btn" style="font-size:11px;">Select All</button>
                    <button onclick="selectAllExportColumns(false)" class="export-btn" style="font-size:11px;">Deselect All</button>
                </div>
                <div class="export-column-list" id="exportColumnList">
                    ${checkboxesHtml}
                </div>
                <div class="btn-row">
                    <button class="submit" onclick="exportFilteredCSV()"><i class="fas fa-file-csv"></i> CSV</button>
                    <button class="submit" onclick="exportFilteredGeoJSON()"><i class="fas fa-globe"></i> GeoJSON</button>
                    <button class="submit" onclick="exportQGISPackage()"><i class="fas fa-box"></i> QGIS Package (ZIP)</button>
                    <button class="cancel" onclick="closeExportModal()">Cancel</button>
                </div>
            </div>
        `;
        document.body.appendChild(overlay);
    }

    function closeExportModal() {
        const overlay = document.getElementById('exportModalOverlay');
        if (overlay) overlay.remove();
    }

    function selectAllExportColumns(selectAll) {
        const checkboxes = document.querySelectorAll('.export-col-checkbox');
        checkboxes.forEach(cb => cb.checked = selectAll);
    }

    function getSelectedColumns() {
        const checkboxes = document.querySelectorAll('.export-col-checkbox:checked');
        return Array.from(checkboxes).map(cb => cb.value);
    }

    function exportFilteredCSV() {
        const data = getFilteredData();
        if (data.length === 0) { showToast('No data to export', 'info'); return; }
        const columns = getSelectedColumns();
        if (columns.length === 0) { showToast('Select at least one column', 'error'); return; }
        let csv = columns.join(',') + '\n';
        data.forEach(row => {
            const values = columns.map(col => {
                let val = row[col] || '';
                if (typeof val === 'string' && (val.includes(',') || val.includes('"'))) {
                    val = '"' + val.replace(/"/g, '""') + '"';
                }
                return val;
            });
            csv += values.join(',') + '\n';
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const link = document.createElement('a');
        link.download = currentTab + '_filtered.csv';
        link.href = URL.createObjectURL(blob);
        link.click();
        closeExportModal();
        showToast('CSV exported', 'success');
    }

    function exportFilteredGeoJSON() {
        const data = getFilteredData();
        if (data.length === 0) { showToast('No data to export', 'info'); return; }
        const columns = getSelectedColumns();
        if (columns.length === 0) { showToast('Select at least one column', 'error'); return; }
        const features = data.map(item => {
            const lat = item.lat || item.latitude;
            const lng = item.lng || item.longitude;
            if (!lat || !lng) return null;
            const props = {};
            columns.forEach(col => {
                props[col] = item[col];
            });
            return {
                type: 'Feature',
                geometry: { type: 'Point', coordinates: [lng, lat] },
                properties: props
            };
        }).filter(f => f !== null);
        const geojson = { type: 'FeatureCollection', features };
        const blob = new Blob([JSON.stringify(geojson, null, 2)], { type: 'application/json' });
        const link = document.createElement('a');
        link.download = currentTab + '_filtered.geojson';
        link.href = URL.createObjectURL(blob);
        link.click();
        closeExportModal();
        showToast('GeoJSON exported', 'success');
    }

    // ============================================================
    // QGIS PACKAGE EXPORT
    // ============================================================
    async function exportQGISPackage() {
        const data = getFilteredData();
        if (data.length === 0) {
            showToast('No data to export', 'info');
            return;
        }

        // Build the filtered GeoJSON
        const features = data.map(item => {
            const lat = item.lat || item.latitude;
            const lng = item.lng || item.longitude;
            if (!lat || !lng) return null;
            const props = { ...item };
            delete props.lat;
            delete props.lng;
            delete props._targetType;
            delete props._targetId;
            return {
                type: 'Feature',
                geometry: { type: 'Point', coordinates: [lng, lat] },
                properties: props
            };
        }).filter(f => f !== null);
        const filteredGeojson = { type: 'FeatureCollection', features };

        // Prepare the ZIP
        const zip = new JSZip();

        // Add filtered plots
        zip.file('nakuru_plots_filtered.geojson', JSON.stringify(filteredGeojson, null, 2));

        // Fetch and add static files from public/docs/
        const staticFiles = [
            'nakuru_wards.geojson',
            'nakuru_subcounties.geojson',
            'nakuru_valuation.qgz',
            'README.md'
        ];
        for (const file of staticFiles) {
            try {
                const response = await fetch(`/docs/${file}`);
                if (!response.ok) throw new Error(`Failed to fetch ${file}`);
                const blob = await response.blob();
                zip.file(file, blob);
            } catch (err) {
                console.warn(`Could not add ${file}:`, err);
                // Fallback: include a placeholder text
                zip.file(file, `# ${file} was not found. Please obtain it from the project repository.`);
            }
        }

        // Generate and download the ZIP
        const content = await zip.generateAsync({ type: 'blob' });
        const link = document.createElement('a');
        link.download = 'nakuru_valuation_qgis_package.zip';
        link.href = URL.createObjectURL(content);
        link.click();
        closeExportModal();
        showToast('QGIS package downloaded!', 'success');
    }

    // ============================================================
    // EXPORT – PNG, PDF
    // ============================================================
    function exportPNG() {
        leafletImage(map, function(err, canvas) {
            if (err) { showToast('Error exporting PNG', 'error'); return; }
            const link = document.createElement('a');
            link.download = currentTab + '_map.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }

    function exportPDF() {
        const element = document.querySelector('#sidebar');
        html2canvas(element, { scale: 2 }).then(canvas => {
            const imgData = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('landscape', 'mm', 'a4');
            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = pdf.internal.pageSize.getHeight();
            pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
            pdf.save(currentTab + '_dashboard.pdf');
        }).catch(err => showToast('Error generating PDF', 'error'));
    }

    // ============================================================
    // INIT
    // ============================================================
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });
    searchInput.addEventListener('input', filterList);
    refreshMap();
    setInterval(() => { if (!isRunning) refreshMap(); }, 300000);
</script>
</body>
