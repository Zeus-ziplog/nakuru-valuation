<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nakuru Land Information Dashboard</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <!-- Export -->
    <script src="https://unpkg.com/leaflet-image@0.4.0/leaflet-image.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Supabase & Chroma -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"></script>
    <style>
        /* ===== Reset & Base ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            display: flex;
            height: 100vh;
            overflow: hidden;
            color: #1e293b;
        }
        #sidebar {
            width: 420px;
            min-width: 420px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #e2e8f0;
            z-index: 10;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar-header {
            padding: 16px 20px;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        #sidebar-header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }
        #sidebar-header h1 span { color: #22c55e; }
        #sidebar-header .badge {
            background: rgba(255,255,255,0.12);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
        }
        .tab-bar {
            display: flex;
            background: #f1f5f9;
            border-bottom: 1px solid #e2e8f0;
            flex-shrink: 0;
            overflow-x: auto;
        }
        .tab-btn {
            flex: 1;
            padding: 10px 8px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            font-weight: 500;
            font-size: 13px;
            color: #475569;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
            min-width: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .tab-btn:hover { background: #e9edf4; }
        .tab-btn.active {
            color: #0f172a;
            border-bottom-color: #2563eb;
            background: white;
        }
        .tab-btn i { font-size: 14px; }
        #sidebar-controls {
            padding: 12px 16px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        #sidebar-controls input {
            flex: 1;
            padding: 6px 12px;
            border: 1px solid #d1d5db;
            border-radius: 30px;
            font-size: 13px;
            outline: none;
            background: white;
            min-width: 100px;
        }
        #sidebar-controls input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        #sidebar-controls select {
            padding: 6px 12px;
            border: 1px solid #d1d5db;
            border-radius: 30px;
            font-size: 13px;
            background: white;
            outline: none;
            cursor: pointer;
            min-width: 120px;
        }
        #sidebar-controls select:focus { border-color: #2563eb; }
        #refreshBtn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }
        #refreshBtn:hover { background: #1d4ed8; }
        #refreshBtn:disabled { background: #94a3b8; cursor: not-allowed; }
        #statusText {
            font-size: 12px;
            color: #475569;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .status-badge {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .status-badge.idle { background: #22c55e; }
        .status-badge.running { background: #eab308; animation: pulse 1s infinite; }
        .status-badge.error { background: #ef4444; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        .export-bar {
            display: flex;
            gap: 6px;
            padding: 6px 12px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .export-btn {
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 500;
            color: #1e293b;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .export-btn:hover { background: #e9edf4; border-color: #2563eb; }
        .export-btn i { font-size: 13px; }
        #property-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
        }
        #property-list::-webkit-scrollbar { width: 5px; }
        #property-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .property-item {
            padding: 10px 16px;
            border-bottom: 1px solid #f1f5f9;
            cursor: pointer;
            transition: background 0.1s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .property-item:hover { background: #f1f5f9; }
        .property-item.active { background: #eef2ff; border-left: 3px solid #2563eb; }
        .property-item .info {
            flex: 1;
            min-width: 0;
        }
        .property-item .info .title {
            font-weight: 500;
            font-size: 14px;
            color: #0f172a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .property-item .info .meta {
            font-size: 12px;
            color: #64748b;
            margin-top: 2px;
        }
        .property-item .info .meta span { margin-right: 12px; }
        .property-item .price {
            font-weight: 600;
            font-size: 14px;
            color: #0f172a;
            white-space: nowrap;
            margin-left: 12px;
        }
        .property-item .source-tag {
            font-size: 9px;
            text-transform: uppercase;
            background: #e2e8f0;
            padding: 2px 8px;
            border-radius: 12px;
            color: #475569;
            margin-left: 6px;
            letter-spacing: 0.3px;
        }
        #map-container {
            flex: 1;
            position: relative;
        }
        #map { height: 100%; width: 100%; }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(15,23,42,0.9);
            color: white;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            backdrop-filter: blur(8px);
        }
        .toast.show { opacity: 1; }
        .toast.error { background: rgba(239,68,68,0.9); }
        .toast.success { background: rgba(34,197,94,0.9); }
        .toast.info { background: rgba(37,99,235,0.9); }
        .legend {
            position: absolute;
            bottom: 30px;
            right: 20px;
            z-index: 1000;
            background: white;
            padding: 12px 16px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            font-size: 12px;
            min-width: 140px;
        }
        .legend .title { font-weight: 600; margin-bottom: 4px; color: #0f172a; }
        .legend .gradient { height: 10px; border-radius: 4px; margin: 4px 0; }
        .legend .labels { display: flex; justify-content: space-between; font-size: 10px; color: #475569; }
        @media (max-width: 768px) {
            #sidebar { width: 100%; min-width: 0; height: 45vh; border-right: none; border-bottom: 1px solid #e2e8f0; }
            #map-container { height: 55vh; }
            body { flex-direction: column; }
            .legend { bottom: 10px; right: 10px; padding: 8px 12px; font-size: 10px; min-width: 100px; }
        }
        .ward-label {
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 12px;
            font-weight: 500;
        }
        .legend-placeholder { display: none; }
    </style>
</head>
<body>

<div id="sidebar">
    <div id="sidebar-header">
        <h1>Nakuru <span>Info</span></h1>
        <span class="badge" id="count-badge">0</span>
    </div>

    <!-- Tabs -->
    <div class="tab-bar" id="tabBar">
        <button class="tab-btn active" data-tab="land"><i class="fas fa-map-marked-alt"></i> Land</button>
        <button class="tab-btn" data-tab="health"><i class="fas fa-hospital"></i> Health</button>
        <button class="tab-btn" data-tab="schools"><i class="fas fa-school"></i> Schools</button>
        <button class="tab-btn" data-tab="water"><i class="fas fa-water"></i> Water</button>
    </div>

    <!-- Controls -->
    <div id="sidebar-controls">
        <span id="statusText">
            <span class="status-badge idle" id="statusBadge"></span>
            <span id="statusLabel">Idle</span>
        </span>
        <select id="statSelect">
            <option value="avg">Avg Price</option>
            <option value="min">Min Price</option>
            <option value="max">Max Price</option>
            <option value="range">Price Range</option>
            <option value="count">Number of Listings</option>
        </select>
        <input type="text" id="searchInput" placeholder="Filter by title, location..." />
        <button id="refreshBtn" onclick="refreshMap()"><i class="fas fa-sync-alt"></i> Refresh</button>
    </div>

    <!-- Export Bar -->
    <div class="export-bar" id="exportBar">
        <button class="export-btn" onclick="exportPNG()"><i class="fas fa-image"></i> PNG</button>
        <button class="export-btn" onclick="exportPDF()"><i class="fas fa-file-pdf"></i> PDF</button>
        <button class="export-btn" onclick="exportCSV()"><i class="fas fa-file-csv"></i> CSV</button>
        <button class="export-btn" onclick="exportGeoJSON()"><i class="fas fa-globe"></i> GeoJSON</button>
        <button class="export-btn" onclick="window.print()"><i class="fas fa-print"></i> Print</button>
    </div>

    <!-- Property List -->
    <div id="property-list">
        <div style="padding:30px 20px;text-align:center;color:#94a3b8;font-size:14px;">Loading data...</div>
    </div>
</div>

<div id="map-container">
    <div id="map"></div>
    <div id="legend-container"></div>
</div>

<div id="toast" class="toast">Loading...</div>

<script>
    // ============================================================
    // CONFIGURATION
    // ============================================================
    const SUPABASE_URL = 'https://oeaoglqrojkexfovrwgl.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9lYW9nbHFyb2prZXhmb3Zyd2dsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMDcyMzYsImV4cCI6MjEwMTY4MzIzNn0.k3DVFFyWwaSCxra2WipcKr1CDJ6eQ2dVELcBAbmFJu8';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const map = L.map('map').setView([-0.3031, 36.0800], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap',
        maxZoom: 18
    }).addTo(map);

    // ---- Global state ----
    let currentTab = 'land';
    let allData = {};
    let activeLayers = {
        land: { heat: null, markers: null, subcounty: null, wards: null },
        health: { markers: null },
        schools: { markers: null },
        water: { markers: null }
    };
    let subCountyStats = {};      // stats based on total price
    let currentStat = 'avg';
    let isRunning = false;
    const propertyList = document.getElementById('property-list');
    const countBadge = document.getElementById('count-badge');
    const searchInput = document.getElementById('searchInput');
    const toastEl = document.getElementById('toast');
    const refreshBtn = document.getElementById('refreshBtn');
    const legendContainer = document.getElementById('legend-container');
    const statSelect = document.getElementById('statSelect');

    // ============================================================
    // HELPERS
    // ============================================================
    function showToast(msg, type) {
        type = type || '';
        toastEl.textContent = msg;
        toastEl.className = 'toast show ' + type;
        clearTimeout(toastEl._timer);
        toastEl._timer = setTimeout(() => { toastEl.className = 'toast'; }, 4000);
    }

    function setStatus(status, message) {
        document.getElementById('statusBadge').className = 'status-badge ' + status;
        document.getElementById('statusLabel').textContent = message;
    }

    function getSize(record) {
        const fields = ['size_ha', 'size', 'area', 'area_ha', 'size_ha_', 'area_ha_'];
        for (let f of fields) {
            if (record[f] !== undefined && record[f] !== null) {
                const val = parseFloat(record[f]);
                if (!isNaN(val) && val > 0) return val;
            }
        }
        return null;
    }

    // ============================================================
    // BUILD POPUP HTML
    // ============================================================
    function buildHealthPopup(facility) {
        const fields = [
            ['Name', 'name'],
            ['Type', 'facility_type'],
            ['Operator', 'operator'],
            ['Ward', 'ward'],
            ['Sub‑county', 'sub_county'],
            ['Town', 'town'],
            ['Level', 'keph_level'],
            ['Beds', 'bed_capacity'],
            ['Regulatory Status', 'regul_status'],
            ['Description', 'description'],
            ['Landmark', 'landmark']
        ];
        let html = `<div style="min-width:220px; font-family:sans-serif;"><strong>${facility.name || 'Unnamed'}</strong><br/>`;
        fields.forEach(([label, key]) => {
            const val = facility[key];
            if (val !== undefined && val !== null && val !== '') {
                html += `<b>${label}:</b> ${val}<br/>`;
            }
        });
        html += '</div>';
        return html;
    }

    function buildLandPopup(item) {
        return `<b>${item.title || 'Untitled'}</b><br/>
                <b>Price:</b> KSh ${(item.price || 0).toLocaleString()}<br/>
                ${item.size_ha ? `<b>Size:</b> ${item.size_ha.toFixed(2)} Ha<br/>` : ''}
                ${item.location ? `<b>Location:</b> ${item.location}<br/>` : ''}
                ${item.source ? `<b>Source:</b> ${item.source}` : ''}`;
    }

    // ============================================================
    // RENDER LIST
    // ============================================================
    function renderList(data, tab) {
        let html = '';
        if (!data || data.length === 0) {
            html = '<div style="padding:30px 20px;text-align:center;color:#94a3b8;font-size:14px;">No data found.</div>';
        } else {
            data.forEach((p, index) => {
                let title, metaHtml, priceHtml;
                if (tab === 'land') {
                    title = p.title || 'Untitled';
                    const sizeStr = p.size_ha ? p.size_ha.toFixed(2) + ' Ha' : '—';
                    const location = p.location || 'Nakuru';
                    metaHtml = `<span>${location}</span><span>${sizeStr}</span>`;
                    priceHtml = p.price ? 'KSh ' + Number(p.price).toLocaleString() : 'N/A';
                } else if (tab === 'health') {
                    title = p.name || 'Unnamed';
                    const type = p.facility_type || '—';
                    const ward = p.ward || '—';
                    const sub = p.sub_county || '—';
                    metaHtml = `<span>${type}</span><span>${ward}</span><span>${sub}</span>`;
                    priceHtml = p.bed_capacity ? `Beds: ${p.bed_capacity}` : '—';
                } else {
                    title = p.name || 'Untitled';
                    metaHtml = `<span>${p.location || 'Nakuru'}</span>`;
                    priceHtml = '—';
                }
                html += `
                    <div class="property-item" data-index="${index}" onclick="zoomToProperty(${index}, '${tab}')">
                        <div class="info">
                            <div class="title">${title}</div>
                            <div class="meta">${metaHtml}</div>
                        </div>
                        <div class="price">${priceHtml}</div>
                    </div>
                `;
            });
        }
        propertyList.innerHTML = html;
        const label = tab === 'land' ? 'plots' : 'records';
        countBadge.textContent = data.length + ' ' + label;
    }

    // ============================================================
    // ZOOM TO PROPERTY
    // ============================================================
    function zoomToProperty(index, tab) {
        const data = allData[tab] || [];
        const p = data[index];
        if (!p) return;
        const lat = p.lat || p.latitude;
        const lng = p.lng || p.longitude;
        if (!lat || !lng) return;
        map.setView([lat, lng], 16);
        const layerGroup = activeLayers[tab]?.markers;
        if (layerGroup) {
            layerGroup.eachLayer((layer) => {
                if (layer._latlng && layer._latlng.lat === lat && layer._latlng.lng === lng) {
                    layer.openPopup();
                }
            });
        }
        const items = propertyList.querySelectorAll('.property-item');
        items.forEach((el, i) => el.classList.toggle('active', i === index));
    }

    // ============================================================
    // FILTER
    // ============================================================
    function filterList() {
        const query = searchInput.value.toLowerCase().trim();
        const data = allData[currentTab] || [];
        if (!query) {
            renderList(data, currentTab);
            return;
        }
        const filtered = data.filter(p => {
            const name = (p.name || p.title || '').toLowerCase();
            const loc = (p.location || p.ward || '').toLowerCase();
            return name.includes(query) || loc.includes(query);
        });
        renderList(filtered, currentTab);
    }

    // ============================================================
    // LOAD BOUNDARIES with dynamic choropleth (using total price stats)
    // ============================================================
    async function loadBoundaries() {
        try {
            const subRes = await fetch('/nakuru_subcounties.geojson');
            if (!subRes.ok) {
                console.warn('Sub-county GeoJSON not found (404)');
            } else {
                const subData = await subRes.json();
                console.log('Sub-county features:', subData.features.length);
                if (activeLayers.land.subcounty) map.removeLayer(activeLayers.land.subcounty);

                const statType = currentStat;
                const values = Object.values(subCountyStats).map(s => s[statType] || 0);
                const maxVal = Math.max(...values, 1);
                const minVal = Math.min(...values, 0);
                const colorScale = chroma.scale(['#e0f2fe', '#0284c7', '#f97316', '#dc2626'])
                    .domain([minVal, maxVal]);

                const style = (feature) => {
                    const name = feature.properties?.NAME || feature.properties?.name || feature.properties?.SubCounty || '';
                    const stat = subCountyStats[name];
                    let val = 0;
                    if (stat) {
                        val = stat[statType] || 0;
                    }
                    return {
                        fillColor: val > 0 ? colorScale(val).hex() : '#f1f5f9',
                        fillOpacity: 0.1,          // transparent – heatmap visible
                        weight: 2,
                        color: '#0f172a',
                        opacity: 0.8
                    };
                };

                const onEachFeature = (feature, layer) => {
                    const name = feature.properties?.NAME || feature.properties?.name || feature.properties?.SubCounty || 'Unknown';
                    const stat = subCountyStats[name];
                    let avg = stat?.avg || 0;
                    let count = stat?.count || 0;
                    let min = stat?.min || 0;
                    let max = stat?.max || 0;
                    layer.bindPopup(`
                        <div style="font-family: sans-serif; min-width: 180px;">
                            <strong>${name}</strong><br/>
                            <span style="color: #555;">
                                Avg price: <strong>KSh ${Math.round(avg).toLocaleString()}</strong><br/>
                                Min: KSh ${Math.round(min).toLocaleString()}<br/>
                                Max: KSh ${Math.round(max).toLocaleString()}<br/>
                                Listings: ${count}
                            </span>
                        </div>
                    `);
                };

                activeLayers.land.subcounty = L.geoJSON(subData, { style, onEachFeature });
                activeLayers.land.subcounty.setZIndex(0);
                if (currentTab === 'land') activeLayers.land.subcounty.addTo(map);

                const legendTitle = {
                    'avg': 'Avg Price',
                    'min': 'Min Price',
                    'max': 'Max Price',
                    'range': 'Price Range (Max-Min)',
                    'count': 'Number of Listings'
                }[statType] || 'Value';

                const legendHtml = `
                    <div class="legend">
                        <div class="title">${legendTitle}</div>
                        <div class="gradient" style="background: linear-gradient(to right, ${colorScale(minVal).hex()}, ${colorScale(maxVal).hex()});"></div>
                        <div class="labels">
                            <span>KSh ${Math.round(minVal).toLocaleString()}</span>
                            <span>KSh ${Math.round(maxVal).toLocaleString()}</span>
                        </div>
                    </div>
                `;
                legendContainer.innerHTML = legendHtml;
                legendContainer.style.display = 'block';
            }

            // ---- WARDS (professional, subtle) ----
            const wardRes = await fetch('/nakuru_wards.geojson');
            if (!wardRes.ok) {
                console.warn('Ward GeoJSON not found (404)');
            } else {
                const wardData = await wardRes.json();
                console.log('Ward features:', wardData.features.length);
                if (activeLayers.land.wards) map.removeLayer(activeLayers.land.wards);

                activeLayers.land.wards = L.geoJSON(wardData, {
                    style: {
                        fill: false,
                        weight: 2,
                        color: '#4a5568',
                        opacity: 0.8,
                        dashArray: null
                    },
                    onEachFeature: (feature, layer) => {
                        const name = feature.properties?.NAME || feature.properties?.name || 'Ward';
                        layer.bindPopup('<strong>' + name + '</strong><br/>Ward boundary');
                        layer.bindTooltip(name, { permanent: false, direction: 'center' });
                    }
                });

                activeLayers.land.wards.setZIndex(1000);
                activeLayers.land.wards.bringToFront();

                if (currentTab === 'land') {
                    activeLayers.land.wards.addTo(map);
                    console.log('Ward layer added to map?', map.hasLayer(activeLayers.land.wards));
                }

                const bounds = activeLayers.land.wards.getBounds();
                if (bounds.isValid()) {
                    map.fitBounds(bounds, { padding: [50, 50] });
                }
            }

            const overlayControl = {
                "Sub-counties (price)": activeLayers.land.subcounty,
                "Wards (outlines)": activeLayers.land.wards
            };
            if (window._layerControl) map.removeControl(window._layerControl);
            window._layerControl = L.control.layers(null, overlayControl, { collapsed: false }).addTo(map);

            console.log('✅ Choropleth + wards loaded');
        } catch (err) {
            console.error('Error loading boundaries:', err);
        }
    }

    // ============================================================
    // SWITCH TAB
    // ============================================================
    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.tab === tab);
        });
        for (const key in activeLayers) {
            for (const layerKey in activeLayers[key]) {
                const layer = activeLayers[key][layerKey];
                if (layer && map.hasLayer(layer)) {
                    map.removeLayer(layer);
                }
            }
        }
        const layers = activeLayers[tab];
        for (const layerKey in layers) {
            const layer = layers[layerKey];
            if (layer && !map.hasLayer(layer)) {
                layer.addTo(map);
            }
        }
        const data = allData[tab] || [];
        renderList(data, tab);
        searchInput.value = '';
        if (tab === 'land' && legendContainer.innerHTML) {
            legendContainer.style.display = 'block';
        } else {
            legendContainer.style.display = 'none';
        }
        if (!allData[tab] || allData[tab].length === 0) {
            refreshMap();
        }
    }

    // ============================================================
    // LOAD DATA FOR A TAB (from Supabase)
    // ============================================================
    async function loadTabData(tab) {
        let tableName;
        if (tab === 'land') {
            tableName = 'listings';
        } else if (tab === 'health') {
            tableName = 'health_facilities';
        } else if (tab === 'schools') {
            tableName = 'schools';
        } else if (tab === 'water') {
            tableName = 'water_sources';
        } else {
            return [];
        }

        try {
            const { data, error } = await supabaseClient
                .from(tableName)
                .select('*')
                .not('latitude', 'is', null)
                .limit(1000);
            if (error) throw error;
            return data || [];
        } catch (err) {
            console.warn(`Error loading ${tab}:`, err);
            return [];
        }
    }

    // ============================================================
    // REFRESH ALL DATA (for current tab)
    // ============================================================
    async function refreshMap() {
        if (isRunning) return;
        isRunning = true;
        setStatus('running', 'Refreshing…');
        showToast('Refreshing data…', 'info');
        refreshBtn.disabled = true;
        refreshBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading…';

        try {
            const tab = currentTab;
            const rawData = await loadTabData(tab);
            if (tab === 'land') {
                allData.land = rawData;

                // ---- Compute sub-county stats based on TOTAL PRICE ----
                const stats = {};
                rawData.forEach(item => {
                    const key = item.location ? item.location.replace(/ County$/i, '').trim() : 'Nakuru';
                    if (!stats[key]) {
                        stats[key] = { prices: [], count: 0 };
                    }
                    if (item.price && item.price > 0) {
                        stats[key].prices.push(item.price);
                    }
                    stats[key].count += 1;
                });

                const computed = {};
                Object.keys(stats).forEach(key => {
                    const s = stats[key];
                    const prices = s.prices;
                    const count = s.count;
                    let avg = 0, min = 0, max = 0, range = 0;
                    if (prices.length > 0) {
                        avg = prices.reduce((a,b) => a+b,0) / prices.length;
                        min = Math.min(...prices);
                        max = Math.max(...prices);
                        range = max - min;
                    }
                    computed[key] = { count, avg, min, max, range };
                });
                subCountyStats = computed;
                console.log('Sub-county stats (total price):', computed);

                // ---- Build heatmap using TOTAL PRICE (global min/max normalisation) ----
                const allPrices = rawData
                    .filter(item => item.price > 0)
                    .map(item => item.price);
                const minPrice = Math.min(...allPrices, 0);
                const maxPrice = Math.max(...allPrices, 1);
                console.log('Global price range:', { min: minPrice, max: maxPrice });

                const points = [];
                const markerData = [];
                rawData.forEach(item => {
                    const size = getSize(item);
                    if (item.latitude && item.longitude && item.price) {
                        const intensity = (maxPrice > minPrice) ? (item.price - minPrice) / (maxPrice - minPrice) : 0;
                        points.push([item.latitude, item.longitude, intensity]);
                        markerData.push({
                            lat: item.latitude,
                            lng: item.longitude,
                            title: item.title || 'Plot',
                            price: item.price,
                            size_ha: size,
                            location: item.location || 'Nakuru',
                            source: item.source || '',
                            pricePerHa: size ? item.price / size : 0
                        });
                    }
                });

                console.log('Heatmap points:', points.length);

                if (activeLayers.land.heat) map.removeLayer(activeLayers.land.heat);
                if (activeLayers.land.markers) map.removeLayer(activeLayers.land.markers);

                if (points.length > 0) {
                    activeLayers.land.heat = L.heatLayer(points, {
                        radius: 40,
                        blur: 25,
                        maxZoom: 15,
                        gradient: {
                            0.0: '#22c55e',
                            0.2: '#84cc16',
                            0.4: '#eab308',
                            0.6: '#f97316',
                            0.8: '#ef4444',
                            1.0: '#dc2626'
                        }
                    });
                    activeLayers.land.heat.addTo(map);
                }

                activeLayers.land.markers = L.layerGroup();
                markerData.forEach(m => {
                    const popupContent = buildLandPopup(m);
                    const circle = L.circleMarker([m.lat, m.lng], {
                        radius: 5,
                        color: '#2563eb',
                        fillColor: '#2563eb',
                        fillOpacity: 0.4,
                        weight: 1.5
                    }).bindPopup(popupContent);
                    activeLayers.land.markers.addLayer(circle);
                });

                allData.land = markerData;

                await loadBoundaries();

                if (points.length > 0) {
                    const bounds = L.latLngBounds(points.map(p => [p[0], p[1]]));
                    map.fitBounds(bounds, { padding: [50, 50] });
                }
                showToast('Loaded ' + rawData.length + ' plots', 'success');

            } else if (tab === 'health') {
                allData.health = rawData;
                if (activeLayers.health.markers) map.removeLayer(activeLayers.health.markers);

                activeLayers.health.markers = L.layerGroup();
                rawData.forEach(item => {
                    const lat = item.latitude;
                    const lng = item.longitude;
                    if (lat && lng) {
                        const popupContent = buildHealthPopup(item);
                        const marker = L.circleMarker([lat, lng], {
                            radius: 6,
                            color: '#e74c3c',
                            fillColor: '#e74c3c',
                            fillOpacity: 0.6,
                            weight: 2
                        }).bindPopup(popupContent);
                        marker._lat = lat;
                        marker._lng = lng;
                        activeLayers.health.markers.addLayer(marker);
                    }
                });
                allData.health = rawData.map(item => ({
                    ...item,
                    lat: item.latitude,
                    lng: item.longitude
                }));

                const points = rawData.filter(p => p.latitude && p.longitude)
                    .map(p => [p.latitude, p.longitude]);
                if (points.length > 0) {
                    const bounds = L.latLngBounds(points);
                    map.fitBounds(bounds, { padding: [50, 50] });
                }
                showToast('Loaded ' + rawData.length + ' health facilities', 'success');
            } else {
                allData[tab] = rawData;
                const groupName = tab;
                if (activeLayers[groupName].markers) map.removeLayer(activeLayers[groupName].markers);
                activeLayers[groupName].markers = L.layerGroup();
                rawData.forEach(item => {
                    if (item.latitude && item.longitude) {
                        const marker = L.circleMarker([item.latitude, item.longitude], {
                            radius: 5,
                            color: '#2ecc71',
                            fillColor: '#2ecc71',
                            fillOpacity: 0.5
                        }).bindPopup(`<b>${item.name || 'Untitled'}</b><br/>${item.location || ''}`);
                        activeLayers[groupName].markers.addLayer(marker);
                    }
                });
                allData[tab] = rawData.map(item => ({ ...item, lat: item.latitude, lng: item.longitude }));
                showToast('Loaded ' + rawData.length + ' records', 'success');
            }

            switchTab(currentTab);

        } catch (err) {
            console.error(err);
            showToast('Error loading data', 'error');
        }

        isRunning = false;
        setStatus('idle', 'Idle');
        refreshBtn.disabled = false;
        refreshBtn.innerHTML = '<i class="fas fa-sync-alt"></i> Refresh';
    }

    // ============================================================
    // UPDATE CHOROPLETH (called when dropdown changes)
    // ============================================================
    function updateChoropleth() {
        const newStat = statSelect.value;
        if (newStat === currentStat) return;
        currentStat = newStat;
        loadBoundaries();
    }

    // ============================================================
    // EXPORT FUNCTIONS
    // ============================================================
    function exportPNG() {
        leafletImage(map, function(err, canvas) {
            if (err) { showToast('Error exporting PNG', 'error'); return; }
            const link = document.createElement('a');
            link.download = currentTab + '_map.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }

    function exportPDF() {
        const element = document.querySelector('#sidebar');
        html2canvas(element, { scale: 2 }).then(canvas => {
            const imgData = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('landscape', 'mm', 'a4');
            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = pdf.internal.pageSize.getHeight();
            pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
            pdf.save(currentTab + '_dashboard.pdf');
        }).catch(err => {
            showToast('Error generating PDF', 'error');
        });
    }

    function exportCSV() {
        const data = allData[currentTab] || [];
        if (data.length === 0) { showToast('No data to export', 'info'); return; }
        const headers = Object.keys(data[0]);
        let csv = headers.join(',') + '\n';
        data.forEach(row => {
            const values = headers.map(h => {
                let val = row[h] || '';
                if (typeof val === 'string' && (val.includes(',') || val.includes('"'))) {
                    val = '"' + val.replace(/"/g, '""') + '"';
                }
                return val;
            });
            csv += values.join(',') + '\n';
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const link = document.createElement('a');
        link.download = currentTab + '_data.csv';
        link.href = URL.createObjectURL(blob);
        link.click();
    }

    function exportGeoJSON() {
        const data = allData[currentTab] || [];
        if (data.length === 0) { showToast('No data to export', 'info'); return; }
        const features = data.map(item => ({
            type: 'Feature',
            geometry: {
                type: 'Point',
                coordinates: [item.lng || item.longitude, item.lat || item.latitude]
            },
            properties: { ...item }
        }));
        const geojson = { type: 'FeatureCollection', features };
        const blob = new Blob([JSON.stringify(geojson, null, 2)], { type: 'application/json' });
        const link = document.createElement('a');
        link.download = currentTab + '_data.geojson';
        link.href = URL.createObjectURL(blob);
        link.click();
    }

    // ============================================================
    // INIT
    // ============================================================
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            switchTab(btn.dataset.tab);
        });
    });

    statSelect.addEventListener('change', updateChoropleth);

    searchInput.addEventListener('input', filterList);

    refreshMap();

    setInterval(() => { if (!isRunning) refreshMap(); }, 300000);
</script>
</body>
