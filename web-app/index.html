<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nakuru Land Valuation</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ===== SIDEBAR ===== */
        #sidebar {
            width: 380px;
            min-width: 380px;
            background: #fff;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #e0e0e0;
            box-shadow: 2px 0 8px rgba(0,0,0,0.05);
            z-index: 10;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar-header {
            padding: 16px 20px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        #sidebar-header h1 {
            font-size: 18px;
            font-weight: 600;
        }
        #sidebar-header h1 span { color: #4CAF50; }
        #sidebar-header .badge {
            background: rgba(255,255,255,0.15);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        #sidebar-controls {
            padding: 12px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        #sidebar-controls input {
            flex: 1;
            padding: 6px 12px;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 13px;
            outline: none;
        }
        #sidebar-controls input:focus { border-color: #4CAF50; }
        #refreshBtn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        #refreshBtn:hover { background: #43a047; }
        #refreshBtn:disabled { background: #999; cursor: not-allowed; }

        #statusText {
            font-size: 12px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .status-badge {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .status-badge.idle { background: #4CAF50; }
        .status-badge.running { background: #FFC107; animation: pulse 1s infinite; }
        .status-badge.error { background: #f44336; }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* ===== PROPERTY LIST ===== */
        #property-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }
        #property-list::-webkit-scrollbar { width: 4px; }
        #property-list::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }

        .property-item {
            padding: 12px 20px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.15s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .property-item:hover { background: #f5f7fa; }
        .property-item.active { background: #e8f0fe; border-left: 3px solid #1a73e8; }

        .property-item .info {
            flex: 1;
            min-width: 0;
        }
        .property-item .info .title {
            font-weight: 500;
            font-size: 14px;
            color: #1a1a2e;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .property-item .info .meta {
            font-size: 12px;
            color: #666;
            margin-top: 2px;
        }
        .property-item .info .meta span {
            margin-right: 12px;
        }
        .property-item .price {
            font-weight: 600;
            font-size: 14px;
            color: #1a1a2e;
            white-space: nowrap;
            margin-left: 12px;
        }
        .property-item .price small {
            font-weight: 400;
            font-size: 11px;
            color: #888;
        }

        .property-item .source-tag {
            font-size: 9px;
            text-transform: uppercase;
            background: #e9ecef;
            padding: 2px 8px;
            border-radius: 12px;
            color: #555;
            margin-left: 8px;
        }

        /* ===== MAP ===== */
        #map-container {
            flex: 1;
            position: relative;
        }
        #map {
            height: 100%;
            width: 100%;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            backdrop-filter: blur(8px);
        }
        .toast.show { opacity: 1; }
        .toast.error { background: rgba(244,67,54,0.9); }
        .toast.success { background: rgba(76,175,80,0.9); }
        .toast.info { background: rgba(33,150,243,0.9); }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            #sidebar {
                width: 100%;
                min-width: 0;
                height: 45vh;
                border-right: none;
                border-bottom: 1px solid #ddd;
            }
            #map-container {
                height: 55vh;
            }
            body { flex-direction: column; }
        }

        /* ===== QGIS PLACEHOLDER ===== */
        #qgis-placeholder {
            display: none;
        }
    </style>
</head>
<body>

    <!-- ===== SIDEBAR ===== -->
    <div id="sidebar">
        <div id="sidebar-header">
            <h1>🏠 Nakuru <span>Valuation</span></h1>
            <span class="badge" id="count-badge">0 plots</span>
        </div>
        <div id="sidebar-controls">
            <span id="statusText">
                <span class="status-badge idle" id="statusBadge"></span>
                <span id="statusLabel">Idle</span>
            </span>
            <input type="text" id="searchInput" placeholder="Filter by title, location..." />
            <button id="refreshBtn" onclick="refreshMap()">🔄 Refresh</button>
        </div>
        <div id="property-list">
            <!-- Items will be injected here -->
            <div style="padding:30px 20px;text-align:center;color:#999;font-size:14px;">
                Loading properties...
            </div>
        </div>
    </div>

    <!-- ===== MAP ===== -->
    <div id="map-container">
        <div id="map"></div>
    </div>

    <!-- ===== TOAST ===== -->
    <div id="toast" class="toast">Loading...</div>

    <script>
        // ============================================================
        // CONFIGURATION
        // ============================================================
        var SUPABASE_URL = 'https://oeaoglqrojkexfovrwgl.supabase.co';
        var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9lYW9nbHFyb2prZXhmb3Zyd2dsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMDcyMzYsImV4cCI6MjEwMTY4MzIzNn0.k3DVFFyWwaSCxra2WipcKr1CDJ6eQ2dVELcBAbmFJu8';

        var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        var map = L.map('map').setView([-0.3031, 36.0800], 10);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap',
            maxZoom: 18
        }).addTo(map);

        var heatLayer = null;
        var markerLayer = null;
        var markers = [];
        var isRunning = false;
        var allProperties = [];

        // ============================================================
        // DOM refs
        // ============================================================
        var propertyList = document.getElementById('property-list');
        var countBadge = document.getElementById('count-badge');
        var searchInput = document.getElementById('searchInput');
        var toastEl = document.getElementById('toast');
        var refreshBtn = document.getElementById('refreshBtn');

        // ============================================================
        // Helper: toast
        // ============================================================
        function showToast(msg, type) {
            type = type || '';
            toastEl.textContent = msg;
            toastEl.className = 'toast show ' + type;
            clearTimeout(toastEl._timer);
            toastEl._timer = setTimeout(function() { toastEl.className = 'toast'; }, 4000);
        }

        // ============================================================
        // Helper: status
        // ============================================================
        function setStatus(status, message) {
            document.getElementById('statusBadge').className = 'status-badge ' + status;
            document.getElementById('statusLabel').textContent = message;
        }

        // ============================================================
        // Render property list
        // ============================================================
        function renderList(properties) {
            var html = '';
            if (!properties || properties.length === 0) {
                html = '<div style="padding:30px 20px;text-align:center;color:#999;font-size:14px;">No properties found.</div>';
                propertyList.innerHTML = html;
                countBadge.textContent = '0 plots';
                return;
            }

            properties.forEach(function(p, index) {
                var priceStr = p.price ? 'KSh ' + Number(p.price).toLocaleString() : 'N/A';
                var sizeStr = p.size_ha ? p.size_ha.toFixed(2) + ' Ha' : 'N/A';
                var title = p.title || 'Plot';
                var location = p.location || 'Nakuru';
                var source = p.source || '';

                html += `
                    <div class="property-item" data-index="${index}" onclick="zoomToProperty(${index})">
                        <div class="info">
                            <div class="title">${title}</div>
                            <div class="meta">
                                <span>📍 ${location}</span>
                                <span>📐 ${sizeStr}</span>
                                ${source ? `<span class="source-tag">${source}</span>` : ''}
                            </div>
                        </div>
                        <div class="price">${priceStr}</div>
                    </div>
                `;
            });

            propertyList.innerHTML = html;
            countBadge.textContent = properties.length + ' plots';
        }

        // ============================================================
        // Filter by search
        // ============================================================
        function filterList() {
            var query = searchInput.value.toLowerCase().trim();
            if (!query) {
                renderList(allProperties);
                return;
            }
            var filtered = allProperties.filter(function(p) {
                var title = (p.title || '').toLowerCase();
                var location = (p.location || '').toLowerCase();
                var source = (p.source || '').toLowerCase();
                return title.includes(query) || location.includes(query) || source.includes(query);
            });
            renderList(filtered);
        }

        // ============================================================
        // Zoom to property on map
        // ============================================================
        function zoomToProperty(index) {
            var props = allProperties;
            if (index < 0 || index >= props.length) return;
            var p = props[index];
            if (p.lat && p.lng) {
                map.setView([p.lat, p.lng], 16);
                // Highlight the marker
                if (markerLayer) {
                    markerLayer.eachLayer(function(layer) {
                        if (layer._latlng && layer._latlng.lat === p.lat && layer._latlng.lng === p.lng) {
                            layer.openPopup();
                        }
                    });
                }
                // Highlight list item
                var items = propertyList.querySelectorAll('.property-item');
                items.forEach(function(el, i) {
                    el.classList.toggle('active', i === index);
                });
            }
        }

        // ============================================================
        // Load data from Supabase
        // ============================================================
        async function loadData() {
            var btn = refreshBtn;
            if (!isRunning) {
                btn.disabled = true;
                btn.innerHTML = '⏳ Loading...';
            }

            try {
                var { data, error } = await supabase
                    .from('listings')
                    .select('latitude, longitude, price, size_ha, title, location, source')
                    .not('latitude', 'is', null)
                    .limit(1000);

                if (error) throw error;

                if (!data || data.length === 0) {
                    allProperties = [];
                    renderList([]);
                    showToast('No data found. Scraper runs daily.', 'info');
                    if (!isRunning) {
                        btn.disabled = false;
                        btn.innerHTML = '🔄 Refresh';
                    }
                    return;
                }

                // Prepare points for heatmap and markers
                var points = [];
                var markerData = [];

                data.forEach(function(item) {
                    if (item.latitude && item.longitude && item.price && item.size_ha > 0) {
                        var pricePerHa = item.price / item.size_ha;
                        var intensity = Math.min(pricePerHa / 1000000, 1);
                        points.push([item.latitude, item.longitude, intensity]);
                        markerData.push({
                            lat: item.latitude,
                            lng: item.longitude,
                            title: item.title || 'Plot',
                            price: item.price,
                            size: item.size_ha,
                            location: item.location || 'Nakuru',
                            source: item.source || '',
                            pricePerHa: pricePerHa
                        });
                    }
                });

                // Store for list and filtering
                allProperties = markerData;

                // Update map
                if (heatLayer) map.removeLayer(heatLayer);
                if (markerLayer) map.removeLayer(markerLayer);

                heatLayer = L.heatLayer(points, {
                    radius: 35,
                    blur: 20,
                    maxZoom: 15,
                    gradient: {
                        0.1: '#00ff00',
                        0.3: '#aadd00',
                        0.5: '#ffff00',
                        0.7: '#ff8800',
                        0.9: '#ff0000'
                    }
                }).addTo(map);

                markerLayer = L.layerGroup();
                markerData.forEach(function(m) {
                    var popupContent = '<b>' + m.title + '</b>' +
                        '<br><b>Price:</b> KSh ' + m.price.toLocaleString() +
                        '<br><b>Size:</b> ' + m.size.toFixed(2) + ' Ha' +
                        '<br><b>Price/Ha:</b> KSh ' + Math.round(m.pricePerHa).toLocaleString() +
                        (m.location ? '<br><b>Location:</b> ' + m.location : '');
                    var circle = L.circleMarker([m.lat, m.lng], {
                        radius: 5,
                        color: '#FF0000',
                        fillColor: '#FF0000',
                        fillOpacity: 0.5,
                        weight: 1.5
                    }).bindPopup(popupContent);
                    markerLayer.addLayer(circle);
                });
                markerLayer.addTo(map);

                // Render list
                renderList(allProperties);

                // Fit bounds
                if (points.length > 0) {
                    var bounds = L.latLngBounds(points.map(function(p) { return [p[0], p[1]]; }));
                    map.fitBounds(bounds, { padding: [50, 50] });
                }

                showToast('✅ ' + data.length + ' plots loaded', 'success');

            } catch (err) {
                console.error(err);
                showToast('❌ Error loading data', 'error');
            }

            if (!isRunning) {
                btn.disabled = false;
                btn.innerHTML = '🔄 Refresh';
            }
        }

        // ============================================================
        // Refresh map (just reload data)
        // ============================================================
        async function refreshMap() {
            if (isRunning) return;
            isRunning = true;
            setStatus('running', 'Refreshing...');
            showToast('🔄 Refreshing data...', 'info');
            await loadData();
            setStatus('idle', 'Idle');
            isRunning = false;
        }

        // ============================================================
        // Search input event
        // ============================================================
        searchInput.addEventListener('input', filterList);

        // ============================================================
        // Initialize
        // ============================================================
        loadData();

        // Auto-refresh every 5 minutes
        setInterval(function() {
            if (!isRunning) {
                loadData();
            }
        }, 300000);
    </script>

</body>
</html>
